<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>密码生成器 | Password Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --blue-1:#9fd0ff;--blue-2:#dff2ff;--blue-3:#edf8ff;
  --pink:#F472B6;--purple:#A78BFA;--green:#34D399;
  --card-bg:rgba(255,255,255,0.85);--card-shadow:0 8px 32px rgba(147,197,253,0.25);
  --radius:24px;
}
html{font-size:16px}
body{
  font-family:'Nunito',sans-serif;min-height:100vh;
  background:linear-gradient(170deg,#D6EEFF 0%,#E8F4FD 30%,#F0F7FF 60%,#F5F0FF 100%);
  background-attachment:fixed;
  display:flex;flex-direction:column;align-items:center;
  padding:40px 20px 60px;overflow-x:hidden;position:relative;
}

.clouds-container{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:hidden}
.cloud{
  position:absolute;background:rgba(255,255,255,0.6);border-radius:50%;
  filter:blur(1px);
}
.cloud::before,.cloud::after{
  content:'';position:absolute;background:inherit;border-radius:50%;
}
.cloud-1{width:120px;height:40px;top:8%;left:-150px;animation:float-cloud 35s linear infinite}
.cloud-1::before{width:50px;height:50px;top:-25px;left:20px}
.cloud-1::after{width:70px;height:55px;top:-30px;left:50px}
.cloud-2{width:160px;height:50px;top:20%;left:-200px;animation:float-cloud 45s linear infinite 5s;opacity:0.5}
.cloud-2::before{width:60px;height:60px;top:-30px;left:30px}
.cloud-2::after{width:80px;height:65px;top:-35px;left:70px}
.cloud-3{width:100px;height:35px;top:35%;left:-130px;animation:float-cloud 40s linear infinite 12s;opacity:0.4}
.cloud-3::before{width:45px;height:45px;top:-22px;left:15px}
.cloud-3::after{width:60px;height:50px;top:-25px;left:40px}
.cloud-4{width:140px;height:45px;top:55%;left:-170px;animation:float-cloud 50s linear infinite 8s;opacity:0.35}
.cloud-4::before{width:55px;height:55px;top:-28px;left:25px}
.cloud-4::after{width:75px;height:60px;top:-32px;left:60px}
.cloud-5{width:90px;height:30px;top:72%;left:-120px;animation:float-cloud 38s linear infinite 20s;opacity:0.3}
.cloud-5::before{width:40px;height:40px;top:-20px;left:12px}
.cloud-5::after{width:55px;height:45px;top:-22px;left:35px}
.cloud-6{width:110px;height:38px;top:88%;left:-140px;animation:float-cloud 42s linear infinite 15s;opacity:0.25}
.cloud-6::before{width:48px;height:48px;top:-24px;left:18px}
.cloud-6::after{width:65px;height:52px;top:-28px;left:48px}

@keyframes float-cloud{
  0%{transform:translateX(0)}
  100%{transform:translateX(calc(100vw + 300px))}
}

.container{
  position:relative;z-index:1;width:100%;max-width:520px;
  display:flex;flex-direction:column;gap:20px;
}

.header{text-align:center;margin-bottom:8px}
.header h1{
  font-size:2rem;font-weight:800;
  background:linear-gradient(135deg,#3B82F6,#8B5CF6,#F472B6);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}
.header p{color:#64748B;font-size:0.95rem;margin-top:4px}

.card{
  background:var(--card-bg);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-radius:var(--radius);
  box-shadow:var(--card-shadow);
  border:1px solid rgba(255,255,255,0.6);
  padding:28px;
  transition:box-shadow 0.3s;
}
.card:hover{box-shadow:0 12px 40px rgba(147,197,253,0.35)}

.password-display{
  display:flex;align-items:center;gap:12px;
}
.password-text{
  flex:1;font-family:'JetBrains Mono','Courier New',monospace;
  font-size:1.35rem;font-weight:700;letter-spacing:1.5px;
  word-break:break-all;line-height:1.6;min-height:2.4em;
  display:flex;flex-wrap:wrap;align-items:center;
}
.password-text .char{display:inline-block;transition:transform 0.15s}
.password-text .char:hover{transform:scale(1.3)}
.char-upper{color:#3B82F6}
.char-lower{color:#F472B6}
.char-number{color:#10B981}
.char-symbol{color:#8B5CF6}

.copy-btn{
  flex-shrink:0;width:48px;height:48px;border:none;border-radius:14px;
  background:linear-gradient(135deg,#93C5FD,#818CF8);
  color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all 0.25s;box-shadow:0 4px 12px rgba(129,140,248,0.3);
}
.copy-btn:hover{transform:scale(1.08);box-shadow:0 6px 20px rgba(129,140,248,0.45)}
.copy-btn:active{transform:scale(0.95)}
.copy-btn svg{width:22px;height:22px}

.strength-section{margin-top:16px}
.strength-label{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:8px;font-size:0.85rem;color:#64748B;font-weight:600;
}
.strength-label span:last-child{font-weight:700}
.strength-bar-bg{
  width:100%;height:8px;border-radius:4px;
  background:rgba(148,163,184,0.15);overflow:hidden;
}
.strength-bar-fill{
  height:100%;border-radius:4px;
  transition:width 0.5s ease,background 0.5s ease;
  width:0%;
}
.strength-weak{width:25%;background:linear-gradient(90deg,#F87171,#FB923C)}
.strength-medium{width:50%;background:linear-gradient(90deg,#FBBF24,#F59E0B)}
.strength-strong{width:75%;background:linear-gradient(90deg,#34D399,#10B981)}
.strength-very-strong{width:100%;background:linear-gradient(90deg,#3B82F6,#8B5CF6)}

.length-section{margin-bottom:4px}
.length-header{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:12px;
}
.length-header label{font-weight:700;color:#334155;font-size:0.95rem}
.length-value{
  font-family:'JetBrains Mono',monospace;font-weight:700;font-size:1.1rem;
  background:linear-gradient(135deg,#3B82F6,#8B5CF6);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}

.slider-track{position:relative;width:100%;height:36px;display:flex;align-items:center}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:8px;
  border-radius:4px;outline:none;cursor:pointer;
  background:linear-gradient(90deg,#93C5FD,#C4B5FD);
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;
  width:26px;height:26px;border-radius:50%;
  background:linear-gradient(135deg,#fff,#E0E7FF);
  border:3px solid #818CF8;
  box-shadow:0 2px 10px rgba(129,140,248,0.35);
  cursor:pointer;transition:transform 0.2s;
}
input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.15)}
input[type=range]::-moz-range-thumb{
  width:26px;height:26px;border-radius:50%;
  background:linear-gradient(135deg,#fff,#E0E7FF);
  border:3px solid #818CF8;
  box-shadow:0 2px 10px rgba(129,140,248,0.35);
  cursor:pointer;
}

.toggles{display:flex;flex-direction:column;gap:14px}
.toggle-row{
  display:flex;align-items:center;justify-content:space-between;
}
.toggle-row label{font-weight:600;color:#334155;font-size:0.95rem;display:flex;align-items:center;gap:8px}
.toggle-row label .icon{font-size:1.1rem}
.toggle-switch{
  position:relative;width:52px;height:28px;cursor:pointer;
}
.toggle-switch input{opacity:0;width:0;height:0}
.toggle-slider{
  position:absolute;inset:0;border-radius:14px;
  background:#CBD5E1;transition:all 0.3s;
}
.toggle-slider::before{
  content:'';position:absolute;width:22px;height:22px;
  border-radius:50%;background:#fff;top:3px;left:3px;
  transition:all 0.3s;box-shadow:0 2px 6px rgba(0,0,0,0.15);
}
.toggle-switch input:checked+.toggle-slider{
  background:linear-gradient(135deg,#93C5FD,#818CF8);
}
.toggle-switch input:checked+.toggle-slider::before{
  transform:translateX(24px);
}

.generate-btn{
  width:100%;padding:16px;border:none;border-radius:16px;
  font-family:'Nunito',sans-serif;font-size:1.1rem;font-weight:700;
  color:#fff;cursor:pointer;
  background:linear-gradient(135deg,#3B82F6,#8B5CF6,#F472B6);
  background-size:200% 200%;
  animation:gradient-shift 4s ease infinite;
  box-shadow:0 6px 24px rgba(99,102,241,0.35);
  transition:all 0.3s;letter-spacing:0.5px;
}
.generate-btn:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 32px rgba(99,102,241,0.45);
}
.generate-btn:active{transform:translateY(0);box-shadow:0 4px 16px rgba(99,102,241,0.3)}

@keyframes gradient-shift{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

.history-title{
  font-weight:700;color:#334155;font-size:0.95rem;
  margin-bottom:12px;display:flex;align-items:center;gap:6px;
}
.history-list{display:flex;flex-direction:column;gap:8px}
.history-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px;border-radius:12px;
  background:rgba(241,245,249,0.7);
  border:1px solid rgba(226,232,240,0.6);
  transition:all 0.2s;
}
.history-item:hover{background:rgba(241,245,249,1);border-color:rgba(199,210,224,0.8)}
.history-pw{
  font-family:'JetBrains Mono',monospace;font-size:0.82rem;
  color:#475569;font-weight:500;letter-spacing:0.5px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  max-width:80%;
}
.history-copy{
  width:32px;height:32px;border:none;border-radius:8px;
  background:rgba(148,163,184,0.15);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all 0.2s;flex-shrink:0;
}
.history-copy:hover{background:rgba(148,163,184,0.3)}
.history-copy svg{width:16px;height:16px;color:#64748B}
.history-empty{
  text-align:center;color:#94A3B8;font-size:0.9rem;
  padding:12px 0;
}

.toast{
  position:fixed;top:30px;left:50%;transform:translateX(-50%) translateY(-80px);
  background:rgba(255,255,255,0.92);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  padding:12px 28px;border-radius:14px;
  box-shadow:0 8px 30px rgba(0,0,0,0.12);
  font-weight:700;font-size:0.95rem;color:#334155;
  z-index:999;opacity:0;transition:all 0.4s cubic-bezier(0.34,1.56,0.64,1);
  border:1px solid rgba(255,255,255,0.6);
  pointer-events:none;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast .check{color:#10B981;margin-right:6px}

@media(max-width:560px){
  body{padding:24px 14px 40px}
  .card{padding:20px}
  .password-text{font-size:1.1rem}
  .header h1{font-size:1.6rem}
}
</style>
</head>
<body>

<div class="clouds-container">
  <div class="cloud cloud-1"></div>
  <div class="cloud cloud-2"></div>
  <div class="cloud cloud-3"></div>
  <div class="cloud cloud-4"></div>
  <div class="cloud cloud-5"></div>
  <div class="cloud cloud-6"></div>
</div>

<div class="container">
  <div class="header">
    <h1>☁️ 密码生成器</h1>
    <p>安全又友好，一键生成强密码</p>
  </div>

  <div class="card">
    <div class="password-display">
      <div class="password-text" id="passwordText"></div>
      <button class="copy-btn" id="copyBtn" title="复制密码">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
      </button>
    </div>
    <div class="strength-section">
      <div class="strength-label">
        <span>密码强度</span>
        <span id="strengthText">--</span>
      </div>
      <div class="strength-bar-bg">
        <div class="strength-bar-fill" id="strengthBar"></div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="length-section">
      <div class="length-header">
        <label>密码长度</label>
        <span class="length-value" id="lengthValue">16</span>
      </div>
      <div class="slider-track">
        <input type="range" id="lengthSlider" min="8" max="64" value="16">
      </div>
    </div>
  </div>

  <div class="card">
    <div class="toggles">
      <div class="toggle-row">
        <label><span class="icon">🔠</span>大写字母 A-Z</label>
        <label class="toggle-switch">
          <input type="checkbox" id="toggleUpper" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>
      <div class="toggle-row">
        <label><span class="icon">🔡</span>小写字母 a-z</label>
        <label class="toggle-switch">
          <input type="checkbox" id="toggleLower" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>
      <div class="toggle-row">
        <label><span class="icon">🔢</span>数字 0-9</label>
        <label class="toggle-switch">
          <input type="checkbox" id="toggleNumbers" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>
      <div class="toggle-row">
        <label><span class="icon">✳️</span>符号 !@#$...</label>
        <label class="toggle-switch">
          <input type="checkbox" id="toggleSymbols" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>
    </div>
  </div>

  <button class="generate-btn" id="generateBtn">✨ 生成密码</button>

  <div class="card">
    <div class="history-title">📜 历史记录</div>
    <div class="history-list" id="historyList">
      <div class="history-empty">暂无历史记录</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"><span class="check">✓</span>已复制!</div>

<script>
(function(){
  var UPPER = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  var LOWER = 'abcdefghijklmnopqrstuvwxyz';
  var NUMBERS = '0123456789';
  var SYMBOLS = '!@#$%^&*()_+-=[]{}|;:,.<>?';

  var passwordText = document.getElementById('passwordText');
  var copyBtn = document.getElementById('copyBtn');
  var strengthBar = document.getElementById('strengthBar');
  var strengthText = document.getElementById('strengthText');
  var lengthSlider = document.getElementById('lengthSlider');
  var lengthValue = document.getElementById('lengthValue');
  var toggleUpper = document.getElementById('toggleUpper');
  var toggleLower = document.getElementById('toggleLower');
  var toggleNumbers = document.getElementById('toggleNumbers');
  var toggleSymbols = document.getElementById('toggleSymbols');
  var generateBtn = document.getElementById('generateBtn');
  var historyList = document.getElementById('historyList');
  var toast = document.getElementById('toast');

  var currentPassword = '';
  var history = [];

  function getCharClass(c){
    if(UPPER.indexOf(c)!==-1) return 'char-upper';
    if(LOWER.indexOf(c)!==-1) return 'char-lower';
    if(NUMBERS.indexOf(c)!==-1) return 'char-number';
    return 'char-symbol';
  }

  function renderPassword(pw){
    passwordText.innerHTML = '';
    for(var i=0;i<pw.length;i++){
      var span = document.createElement('span');
      span.className = 'char ' + getCharClass(pw[i]);
      span.textContent = pw[i];
      passwordText.appendChild(span);
    }
  }

  function calcStrength(pw){
    var score = 0;
    var hasUpper=false,hasLower=false,hasNum=false,hasSym=false;
    for(var i=0;i<pw.length;i++){
      if(UPPER.indexOf(pw[i])!==-1) hasUpper=true;
      else if(LOWER.indexOf(pw[i])!==-1) hasLower=true;
      else if(NUMBERS.indexOf(pw[i])!==-1) hasNum=true;
      else hasSym=true;
    }
    var types = (hasUpper?1:0)+(hasLower?1:0)+(hasNum?1:0)+(hasSym?1:0);
    score += types * 15;
    if(pw.length>=8) score+=10;
    if(pw.length>=12) score+=10;
    if(pw.length>=16) score+=10;
    if(pw.length>=24) score+=10;
    if(pw.length>=32) score+=5;
    if(hasUpper&&hasLower) score+=10;
    if(hasNum&&hasSym) score+=10;
    if(types===4&&pw.length>=16) score+=10;
    return Math.min(score,100);
  }

  function updateStrength(pw){
    var s = calcStrength(pw);
    strengthBar.className = 'strength-bar-fill';
    if(s<30){
      strengthBar.classList.add('strength-weak');
      strengthText.textContent='弱';
      strengthText.style.color='#F87171';
    }else if(s<55){
      strengthBar.classList.add('strength-medium');
      strengthText.textContent='中等';
      strengthText.style.color='#F59E0B';
    }else if(s<80){
      strengthBar.classList.add('strength-strong');
      strengthText.textContent='强';
      strengthText.style.color='#10B981';
    }else{
      strengthBar.classList.add('strength-very-strong');
      strengthText.textContent='非常强';
      strengthText.style.color='#8B5CF6';
    }
  }

  function generatePassword(){
    var pool = '';
    var required = [];
    if(toggleUpper.checked){pool+=UPPER;required.push(UPPER);}
    if(toggleLower.checked){pool+=LOWER;required.push(LOWER);}
    if(toggleNumbers.checked){pool+=NUMBERS;required.push(NUMBERS);}
    if(toggleSymbols.checked){pool+=SYMBOLS;required.push(SYMBOLS);}
    if(!pool){
      toast.textContent='请至少选择一种字符类型';
      toast.classList.add('show');
      setTimeout(function(){toast.classList.remove('show')},2000);
      return;
    }
    var len = parseInt(lengthSlider.value);
    var arr = new Uint32Array(len);
    crypto.getRandomValues(arr);
    var pw = '';
    var guaranteed = [];
    for(var i=0;i<required.length;i++){
      var rIdx = new Uint32Array(1);
      crypto.getRandomValues(rIdx);
      guaranteed.push(required[i][rIdx[0]%required[i].length]);
    }
    for(var i=0;i<len;i++){
      pw += pool[arr[i]%pool.length];
    }
    var pwArr = pw.split('');
    for(var i=0;i<guaranteed.length&&i<len;i++){
      var pos = new Uint32Array(1);
      crypto.getRandomValues(pos);
      pwArr[pos[0]%len] = guaranteed[i];
    }
    pw = pwArr.join('');
    currentPassword = pw;
    renderPassword(pw);
    updateStrength(pw);
    addToHistory(pw);
  }

  function addToHistory(pw){
    for(var i=0;i<history.length;i++){
      if(history[i]===pw) return;
    }
    history.unshift(pw);
    if(history.length>5) history.pop();
    renderHistory();
  }

  function renderHistory(){
    if(history.length===0){
      historyList.innerHTML='<div class="history-empty">暂无历史记录</div>';
      return;
    }
    historyList.innerHTML='';
    for(var i=0;i<history.length;i++){
      var item = document.createElement('div');
      item.className='history-item';
      var pwSpan = document.createElement('span');
      pwSpan.className='history-pw';
      pwSpan.textContent=history[i];
      var copySmall = document.createElement('button');
      copySmall.className='history-copy';
      copySmall.title='复制';
      copySmall.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>';
      (function(p){
        copySmall.addEventListener('click',function(){copyToClipboard(p)});
      })(history[i]);
      item.appendChild(pwSpan);
      item.appendChild(copySmall);
      historyList.appendChild(item);
    }
  }

  function copyToClipboard(text){
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(text);
    }else{
      var ta=document.createElement('textarea');
      ta.value=text;ta.style.position='fixed';ta.style.left='-9999px';
      document.body.appendChild(ta);ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }
    showToast();
  }

  function showToast(){
    toast.innerHTML='<span class="check">✓</span>已复制!';
    toast.classList.add('show');
    setTimeout(function(){toast.classList.remove('show')},1800);
  }

  lengthSlider.addEventListener('input',function(){
    lengthValue.textContent=this.value;
  });

  copyBtn.addEventListener('click',function(){
    if(currentPassword) copyToClipboard(currentPassword);
  });

  generateBtn.addEventListener('click',generatePassword);

  var toggles=[toggleUpper,toggleLower,toggleNumbers,toggleSymbols];
  toggles.forEach(function(t){
    t.addEventListener('change',function(){
      var anyOn=false;
      toggles.forEach(function(tt){if(tt.checked) anyOn=true});
      if(!anyOn){
        t.checked=true;
        toast.textContent='请至少选择一种字符类型';
        toast.classList.remove('show');
        void toast.offsetHeight;
        toast.classList.add('show');
        setTimeout(function(){toast.classList.remove('show')},2000);
      }
    });
  });

  generatePassword();
})();
</script>
</body>
</html>
