<head>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="./assets/index-Dg24nuQD.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-DeZ8CYAY.css">

  <style>
    /* ========================================
       Cloud Glider - 滑板云动画
       ======================================== */

    /* 整体飘浮 */
    @keyframes cg-float {
      0%, 100% { transform: translateY(0) rotate(-1.5deg); }
      30% { transform: translateY(-20px) rotate(1deg); }
      60% { transform: translateY(-10px) rotate(-0.5deg); }
    }

    /* 眨眼 */
    @keyframes cg-blink {
      0%, 42%, 46%, 100% { transform: scaleY(1); }
      44% { transform: scaleY(0.08); }
    }

    /* 彩虹尾迹飘动 */
    @keyframes cg-trail-wave {
      0%, 100% { transform: scaleX(1) rotate(0deg); opacity: 0.85; }
      50% { transform: scaleX(1.08) rotate(1deg); opacity: 1; }
    }

    /* 尾迹星星闪烁 */
    @keyframes cg-sparkle {
      0%, 100% { opacity: 0.2; transform: scale(0.6) rotate(0deg); }
      50% { opacity: 1; transform: scale(1.3) rotate(180deg); }
    }

    /* 风线 */
    @keyframes cg-wind {
      0% { transform: translateX(0) scaleX(0.3); opacity: 0; }
      20% { opacity: 0.7; }
      100% { transform: translateX(-120px) scaleX(1.2); opacity: 0; }
    }

    /* 背景云层漂移 */
    @keyframes cg-cloud-drift {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }

    /* 伴飞元素 */
    @keyframes cg-companion-fly {
      from { left: 105%; }
      to { left: -15%; }
    }
    @keyframes cg-companion-bob {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25% { transform: translateY(-18px) rotate(8deg); }
      75% { transform: translateY(-18px) rotate(-8deg); }
    }

    /* 地面波浪 */
    @keyframes cg-ground {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(8px); }
    }

    /* 光晕呼吸 */
    @keyframes cg-glow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(1.1); }
    }

    /* 进入动画 */
    @keyframes cg-enter {
      0% { opacity: 0; transform: translateX(80px); }
      100% { opacity: 1; transform: translateX(0); }
    }

    /* ========================================
       容器
       ======================================== */
    #cloud-glider {
      position: fixed;
      top: 0;
      right: 0;
      width: 460px;
      height: 100vh;
      z-index: 999;
      pointer-events: none;
      overflow: hidden;
      animation: cg-enter 1s ease-out;
    }

    .cg-sky {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, #60a5fa 0%, #93c5fd 35%, #bfdbfe 70%, #dbeafe 100%);
      border-radius: 28px 0 0 28px;
      overflow: hidden;
    }

    /* ========================================
       背景云层
       ======================================== */
    .cg-cloud-layer {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .cg-cloud-track {
      display: flex;
      height: 100%;
      width: 200%;
      animation: cg-cloud-drift var(--speed) linear infinite;
    }
    .cg-cloud-group {
      display: flex;
      width: 100%;
      justify-content: space-around;
      align-items: flex-end;
      padding-bottom: 60px;
    }
    .cg-cloud-item {
      opacity: var(--opacity);
      filter: blur(2px);
      transform: scale(var(--scale));
    }

    /* ========================================
       滑板云角色
       ======================================== */
    .cg-skater-wrap {
      position: absolute;
      left: 15%;
      top: 48%;
      transform: translateY(-50%);
      z-index: 30;
      animation: cg-float 3.5s ease-in-out infinite;
    }

    /* 光晕 */
    .cg-skater-glow {
      position: absolute;
      inset: -50px;
      background: radial-gradient(ellipse at center, rgba(135,206,250,0.35) 0%, rgba(255,255,255,0.1) 45%, transparent 70%);
      border-radius: 50%;
      filter: blur(18px);
      animation: cg-glow 4s ease-in-out infinite;
    }

    /* 角色主体（含白色贴纸边框） */
    .cg-character {
      position: relative;
      filter: drop-shadow(0 8px 24px rgba(100,150,200,0.3));
    }

    /* 眨眼控制 */
    .cg-eye-pair {
      animation: cg-blink 4.5s ease-in-out infinite;
    }

    /* 彩虹尾迹 */
    .cg-rainbow-trail {
      position: absolute;
      left: -90px;
      top: 35%;
      transform-origin: right center;
      animation: cg-trail-wave 2s ease-in-out infinite;
    }

    /* 尾迹星星 */
    .cg-trail-sparkle {
      position: absolute;
      animation: cg-sparkle 2s ease-in-out infinite;
    }

    /* 风线 */
    .cg-wind-lines {
      position: absolute;
      left: -60px;
      top: 40%;
      pointer-events: none;
    }
    .cg-wind-line {
      position: absolute;
      height: 3px;
      background: linear-gradient(90deg, rgba(255,255,255,0.7), rgba(200,220,255,0.3), transparent);
      border-radius: 999px;
      animation: cg-wind 2.5s ease-out infinite;
    }

    /* ========================================
       伴飞元素
       ======================================== */
    .cg-companion {
      position: absolute;
      z-index: 20;
      pointer-events: none;
      animation: cg-companion-fly var(--dur) linear forwards,
                 cg-companion-bob 3s ease-in-out infinite;
    }

    /* ========================================
       地面
       ======================================== */
    .cg-ground-blur {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 140px;
      background: rgba(255,255,255,0.35);
      filter: blur(18px);
      z-index: 10;
    }
    .cg-ground-wave {
      position: absolute;
      bottom: -40px; left: -10%;
      width: 120%; height: 200px;
      background: rgba(255,255,255,0.75);
      border-radius: 100% 100% 0 0;
      z-index: 20;
      animation: cg-ground 4s ease-in-out infinite;
    }

    /* ========================================
       装饰风线
       ======================================== */
    .cg-deco-wind {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 40;
    }
    .cg-deco-line {
      position: absolute;
      height: 1px;
      background: rgba(255,255,255,0.18);
      animation: cg-cloud-drift var(--dur) linear infinite;
      animation-delay: var(--delay);
    }

    /* ========================================
       标题
       ======================================== */
    .cg-title {
      position: absolute;
      top: 28px; left: 24px;
      z-index: 50;
      pointer-events: none;
    }
    .cg-title h1 {
      font-family: 'Archivo Black', sans-serif;
      font-size: 1.8rem;
      color: white;
      text-shadow: 0 2px 12px rgba(0,0,0,0.12);
      letter-spacing: -0.02em;
      margin: 0;
      line-height: 1.1;
    }
    .cg-title p {
      font-family: 'Space Mono', monospace;
      font-size: 0.75rem;
      color: rgba(255,255,255,0.75);
      margin-top: 4px;
    }

    /* ========================================
       响应式
       ======================================== */
    @media (max-width: 1280px) {
      #cloud-glider { width: 380px; }
      .cg-skater-wrap { left: 10%; }
    }
    @media (max-width: 1024px) {
      #cloud-glider { width: 320px; }
    }
    @media (max-width: 768px) {
      #cloud-glider {
        width: 100vw;
        height: 42vh;
        top: auto; bottom: 0;
      }
      .cg-sky { border-radius: 24px 24px 0 0; }
      .cg-title h1 { font-size: 1.3rem; }
      .cg-skater-wrap { left: 15%; top: 40%; }
      @keyframes cg-enter {
        0% { opacity: 0; transform: translateY(60px); }
        100% { opacity: 1; transform: translateY(0); }
      }
    }
  </style>
</head>
<body>

  <!-- Cloud Glider 动画 -->

          <svg width="220" height="210" viewBox="0 0 220 210">

              </g>
              <g class="cg-trail-sparkle" style="animation-delay:0.8s;">
                <path d="M60,100 L61,103 L64,104 L61,105 L60,108 L59,105 L56,104 L59,103Z" fill="#6BCB77"/>
              </g>
            </g>

            <!-- ===== 轮子运动线 ===== -->
            <g stroke="#555" stroke-width="1.2" stroke-linecap="round" opacity="0.45">
              <line x1="68" y1="178" x2="60" y2="184"/>
              <line x1="70" y1="181" x2="62" y2="187"/>
              <line x1="72" y1="184" x2="64" y2="190"/>

              <line x1="151" y1="184" x2="159" y2="190"/>
            </g>

            <!-- ===== 滑板 ===== -->
            <g transform="translate(48, 162)">
              <!-- 板面阴影 -->
              <path d="M2,10 Q7,2 18,4 L82,4 Q93,2 98,10 Q93,18 82,16 L18,16 Q7,18 2,10 Z" 
                    fill="rgba(0,0,0,0.1)" transform="translate(0,3)"/>
              <!-- 板面主体 -->
              <path d="M0,8 Q5,0 16,2 L80,2 Q91,0 96,8 Q91,16 80,14 L16,14 Q5,16 0,8 Z"

              <!-- 板面高光 -->

  <script>
  (function() {
    /* 生成云朵 SVG */
    function cloudSVG(size) {
      const s = document.createElementNS('http://www.w3.org/2000/svg','svg');
      s.setAttribute('width', size);
      s.setAttribute('height', size * 0.55);
      s.setAttribute('viewBox','0 0 120 66');
      s.innerHTML = '<path d="M25,50 Q5,50 5,36 Q5,22 25,22 Q25,6 50,6 Q75,6 75,22 Q100,6 115,22 Q130,36 115,50 Q115,62 90,62 Q65,62 58,50 Q40,62 25,50Z" fill="white"/>';
      return s;
    }

    /* 填充云层 */
    function fillClouds(id, n, opacity, sMin, sMax) {
      const c = document.getElementById(id);
      if (!c) return;
      for (let i = 0; i < n; i++) {
        const w = document.createElement('div');
        w.className = 'cg-cloud-item';
        const sc = sMin + Math.random()*(sMax-sMin);
        const sz = 90 + Math.random()*70;
        w.style.cssText = '--opacity:'+opacity+';--scale:'+sc+';';
        w.appendChild(cloudSVG(sz));
        c.appendChild(w);
      }
    }
    fillClouds('cg-bg1',4,0.25,0.7,1.2);
    fillClouds('cg-bg2',4,0.25,0.7,1.2);
    fillClouds('cg-mid1',5,0.45,0.8,1.3);
    fillClouds('cg-mid2',5,0.45,0.8,1.3);
    fillClouds('cg-fg1',4,0.7,0.8,1.2);
    fillClouds('cg-fg2',4,0.7,0.8,1.2);

    /* 伴飞元素 */
    const types = [
      { svg: s=>`<svg width="${s}" height="${s}" viewBox="0 0 48 48"><circle cx="24" cy="24" r="11" fill="#facc15" stroke="#f59e0b" stroke-width="2"/><g stroke="#facc15" stroke-width="2.5" stroke-linecap="round">${[0,45,90,135,180,225,270,315].map(a=>`<line x1="24" y1="5" x2="24" y2="10" transform="rotate(${a} 24 24)"/>`).join('')}</g></svg>` },
      { svg: s=>`<svg width="${s}" height="${s}" viewBox="0 0 32 32"><path d="M16 0L20 12L32 16L20 20L16 32L12 20L0 16L12 12Z" fill="#fde047" stroke="#eab308" stroke-width="1"/></svg>` },
      { svg: s=>`<svg width="${s}" height="${s*0.6}" viewBox="0 0 36 22"><path d="M2,16 Q10,4 18,12 Q26,4 34,16" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/></svg>` },
      { svg: s=>`<svg width="${s}" height="${s*0.85}" viewBox="0 0 24 20"><path d="M12 18L3 10C0 7 0 3 3 1.5C6 0 9 2 12 5C15 2 18 0 21 1.5C24 3 24 7 21 10Z" fill="#f472b6" stroke="#ec4899" stroke-width="1"/></svg>` },
      { svg: s=>`<svg width="${s}" height="${s}" viewBox="0 0 20 20"><path d="M10 0L12 8L20 10L12 12L10 20L8 12L0 10L8 8Z" fill="white" opacity="0.9"/></svg>` },
    ];
    const box = document.getElementById('cg-companions');
    let cnt = 0;
    function spawn() {
      if (cnt >= 10) return;
      const t = types[Math.floor(Math.random()*types.length)];
      const el = document.createElement('div');
      el.className = 'cg-companion';
      const y = 8+Math.random()*42, dur = 5+Math.random()*5, sc = 0.7+Math.random()*0.6;
      const sz = [20,32,36,24,18][types.indexOf(t)] * sc;
      el.style.cssText = 'top:'+y+'%;--dur:'+dur+'s;transform:scale('+sc+');';
      el.innerHTML = t.svg(sz);
      box.appendChild(el);
      cnt++;
      setTimeout(()=>{ el.remove(); cnt--; }, dur*1000);
    }
    setInterval(spawn, 2200);
    setTimeout(spawn, 400);
    setTimeout(spawn, 900);

    /* 装饰风线 */
    const dw = document.getElementById('cg-deco-wind');
    for (let i = 0; i < 5; i++) {
      const l = document.createElement('div');
      l.className = 'cg-deco-line';
      l.style.cssText = 'top:'+(18+i*14)+'%;width:'+(80+Math.random()*180)+'px;left:-200px;--dur:'+(2+Math.random()*2)+'s;--delay:'+(i*0.5)+'s;';
      dw.appendChild(l);
    }
  })();
  </script>
</body>
</html>
