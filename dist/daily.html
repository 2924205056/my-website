<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的日常 - 宁小包</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ===== CSS Variables ===== */
    :root {
      --bg-primary: #E8F4FD;
      --bg-secondary: #F0F7FF;
      --text-primary: #1E293B;
      --text-secondary: #475569;
      --text-muted: #94A3B8;
      --card-bg: rgba(255,255,255,0.85);
      --card-border: rgba(255,255,255,0.9);
      --accent-pink: #F472B6;
      --accent-coral: #FB923C;
      --accent-yellow: #FACC15;
      --accent-green: #4ADE80;
      --accent-blue: #60A5FA;
      --accent-purple: #A78BFA;
      --shadow-soft: 0 8px 32px rgba(100,170,230,0.12);
      --shadow-hover: 0 20px 48px rgba(100,170,230,0.18);
      --radius-lg: 24px;
      --radius-md: 16px;
      --radius-sm: 12px;
    }

    /* ===== Reset ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ===== Body ===== */
    body {
      font-family: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(170deg, #D6EEFF 0%, var(--bg-primary) 30%, var(--bg-secondary) 60%, #F5F0FF 100%);
      background-attachment: fixed;
      min-height: 100vh;
      color: var(--text-secondary);
      padding: 0;
      line-height: 1.6;
    }

    /* ===== Custom Scrollbar ===== */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: rgba(232,244,252,0.3); border-radius: 4px; }
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, var(--accent-blue), var(--accent-purple));
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(180deg, #93c5fd, #c4b5fd);
    }
    ::selection {
      background: rgba(244,114,182,0.2);
      color: var(--text-primary);
    }

    /* ===== Header / Nav ===== */
    .daily-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--card-bg);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border-bottom: 1px solid var(--card-border);
      box-shadow: 0 4px 24px rgba(100,170,230,0.08);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .daily-header .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .daily-header .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(232,244,252,0.7);
      border: 1.5px solid rgba(200,225,245,0.5);
      border-radius: var(--radius-sm);
      padding: 8px 16px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s, background 0.3s, opacity 0.3s;
      text-decoration: none;
    }
    .daily-header .back-btn:focus-visible {
      outline: 2px solid var(--accent-blue);
      outline-offset: 2px;
    }
    .daily-header .back-btn:hover {
      background: rgba(200,225,245,0.8);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(100,170,230,0.12);
    }
    .daily-header h1 {
      font-size: 22px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--text-primary) 0%, var(--accent-blue) 50%, var(--accent-pink) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .daily-header .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* ===== Buttons ===== */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 20px;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: transform 0.3s, box-shadow 0.3s, background 0.3s, opacity 0.3s;
    }
    .btn:focus-visible {
      outline: 2px solid var(--accent-blue);
      outline-offset: 2px;
    }
    .btn:hover {
      transform: translateY(-2px);
    }
    .btn:active {
      transform: translateY(0);
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      color: white;
      box-shadow: 0 4px 16px rgba(96,165,250,0.3);
    }
    .btn-primary:hover {
      box-shadow: 0 8px 24px rgba(96,165,250,0.4);
    }
    .btn-rainbow {
      background: linear-gradient(90deg, var(--accent-pink) 0%, var(--accent-coral) 25%, var(--accent-yellow) 50%, var(--accent-green) 75%, var(--accent-blue) 100%);
      background-size: 200% 100%;
      color: white;
      box-shadow: 0 4px 16px rgba(244,114,182,0.25);
      font-weight: 800;
    }
    .btn-rainbow:hover {
      background-position: right center;
      box-shadow: 0 8px 24px rgba(244,114,182,0.35);
    }
    .btn-outline {
      background: var(--card-bg);
      backdrop-filter: blur(8px);
      border: 1.5px solid rgba(200,225,245,0.6);
      color: var(--text-secondary);
    }
    .btn-outline:hover {
      background: rgba(232,244,252,0.95);
      box-shadow: var(--shadow-soft);
    }
    .btn-danger {
      background: rgba(239,68,68,0.08);
      border: 1.5px solid rgba(239,68,68,0.25);
      color: #dc2626;
    }
    .btn-danger:hover {
      background: rgba(239,68,68,0.15);
      transform: translateY(-2px);
    }
    .btn-sm {
      padding: 6px 14px;
      font-size: 12px;
      border-radius: var(--radius-sm);
    }

    /* ===== Main Container ===== */
    .container {
      max-width: 640px;
      margin: 0 auto;
      padding: 28px 16px 80px;
    }

    /* ===== Admin Bar ===== */
    .admin-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
      padding: 12px 20px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      box-shadow: var(--shadow-soft);
    }
    .admin-bar label { cursor: pointer; user-select: none; }
    .admin-bar input[type="checkbox"] {
      width: 18px; height: 18px;
      accent-color: var(--accent-pink);
      cursor: pointer;
    }

    /* ===== Data Bar ===== */
    .data-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
      padding: 12px 20px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      box-shadow: var(--shadow-soft);
    }

    /* ===== Post Form Card ===== */
    .post-form-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-soft);
      padding: 28px;
      margin-bottom: 28px;
      display: none;
      animation: slideDown 0.4s cubic-bezier(0.4,0,0.2,1);
    }
    .post-form-card.visible { display: block; }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== Form Groups ===== */
    .form-group { margin-bottom: 18px; }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 8px;
      letter-spacing: 0.01em;
    }

    /* Textarea */
    .form-group textarea {
      width: 100%;
      min-height: 110px;
      padding: 14px 18px;
      border: 1.5px solid rgba(200,225,245,0.5);
      border-radius: var(--radius-md);
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      background: rgba(255,255,255,0.7);
      resize: vertical;
      transition: border-color 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
      outline: none;
    }
    .form-group textarea:focus-visible {
      outline: 2px solid var(--accent-pink);
      outline-offset: 2px;
    }
    .form-group textarea::placeholder {
      color: var(--text-muted);
      font-weight: 600;
    }
    .form-group textarea:focus {
      border-color: var(--accent-pink);
      box-shadow: 0 0 0 3px rgba(244,114,182,0.12);
      background: rgba(255,255,255,0.95);
    }

    /* Text inputs */
    .form-group input[type="text"],
    .form-group input[type="datetime-local"] {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid rgba(200,225,245,0.5);
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      background: rgba(255,255,255,0.7);
      outline: none;
      transition: border-color 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
    }
    .form-group input[type="text"]:focus-visible,
    .form-group input[type="datetime-local"]:focus-visible {
      outline: 2px solid var(--accent-pink);
      outline-offset: 2px;
    }
    .form-group input[type="text"]::placeholder {
      color: var(--text-muted);
      font-weight: 600;
    }
    .form-group input[type="text"]:focus,
    .form-group input[type="datetime-local"]:focus {
      border-color: var(--accent-pink);
      box-shadow: 0 0 0 3px rgba(244,114,182,0.12);
      background: rgba(255,255,255,0.95);
    }

    /* ===== Mood Selector ===== */
    .mood-selector {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .mood-option {
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      border-radius: var(--radius-sm);
      border: 2.5px solid transparent;
      background: rgba(255,255,255,0.7);
      cursor: pointer;
      transition: transform 0.25s, border-color 0.25s, box-shadow 0.25s;
    }
    .mood-option:focus-visible {
      outline: 2px solid var(--accent-blue);
      outline-offset: 2px;
    }
    .mood-option:hover {
      transform: scale(1.15);
      background: rgba(232,244,252,0.9);
      box-shadow: 0 4px 12px rgba(100,170,230,0.12);
    }
    .mood-option.selected {
      border-image: linear-gradient(135deg, var(--accent-pink), var(--accent-coral), var(--accent-yellow), var(--accent-green), var(--accent-blue)) 1;
      border-style: solid;
      border-width: 3px;
      background: rgba(244,114,182,0.06);
      box-shadow: 0 4px 16px rgba(244,114,182,0.2);
      transform: scale(1.1);
    }
    .mood-label {
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
      margin-top: 2px;
    }

    /* ===== Image Upload ===== */
    .image-upload-area {
      border: 2px dashed rgba(200,225,245,0.6);
      border-radius: var(--radius-md);
      padding: 28px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.3s, background 0.3s, transform 0.3s;
      background: rgba(255,255,255,0.5);
    }
    .image-upload-area:focus-visible {
      outline: 2px solid var(--accent-pink);
      outline-offset: 2px;
    }
    .image-upload-area:hover {
      border-color: var(--accent-pink);
      background: rgba(244,114,182,0.04);
      box-shadow: 0 4px 16px rgba(244,114,182,0.08);
    }
    .image-upload-area .upload-icon {
      font-size: 36px;
      margin-bottom: 8px;
    }
    .image-upload-area .upload-text {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-secondary);
    }
    .image-upload-area .upload-hint {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .image-previews {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
    }
    .image-preview-item {
      position: relative;
      width: 90px;
      height: 90px;
      border-radius: var(--radius-sm);
      overflow: hidden;
      border: 2px solid rgba(200,225,245,0.5);
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1); }
    }
    .image-preview-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .image-preview-item .remove-img {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 22px;
      height: 22px;
      background: rgba(239,68,68,0.85);
      color: white;
      border: none;
      border-radius: 50%;
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease;
    }
    .image-preview-item .remove-img:hover { transform: scale(1.15); }

    /* ===== Form Actions ===== */
    .form-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 24px;
    }

    /* ===== Post Card ===== */
    .post-card {
      position: relative;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-soft);
      padding: 24px;
      margin-bottom: 20px;
      transition: transform 0.35s, box-shadow 0.35s;
      animation: fadeIn 0.4s ease;
    }
    .post-card:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow-hover);
    }

    /* Pinned post - rainbow gradient top border */
    .post-card.pinned {
      border: 1px solid var(--card-border);
      background: rgba(255,255,255,0.9);
    }
    .post-card.pinned::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--accent-pink), var(--accent-coral), var(--accent-yellow), var(--accent-green), var(--accent-blue), var(--accent-purple));
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    }

    /* ===== Post Header ===== */
    .post-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .post-header .post-meta {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .post-header .post-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2.5px solid rgba(200,225,245,0.5);
      object-fit: cover;
      transition: border-color 0.3s ease;
    }
    .post-card:hover .post-avatar {
      border-color: var(--accent-pink);
    }
    .post-header .post-info .post-name {
      font-size: 15px;
      font-weight: 800;
      color: var(--text-primary);
    }
    .post-header .post-info .post-time {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
    }
    .post-header .post-pin-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: linear-gradient(135deg, rgba(250,204,21,0.12), rgba(244,114,182,0.08));
      border: 1px solid rgba(250,204,21,0.25);
      border-radius: 20px;
      padding: 4px 14px;
      font-size: 12px;
      font-weight: 800;
      color: #d97706;
    }

    /* ===== Post Content ===== */
    .post-content {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.75;
      color: var(--text-secondary);
      margin-bottom: 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .post-mood {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    /* ===== Post Images Grid ===== */
    .post-images {
      display: grid;
      gap: 8px;
      margin-bottom: 14px;
      border-radius: var(--radius-md);
      overflow: hidden;
    }
    .post-images.grid-1 { grid-template-columns: 1fr; }
    .post-images.grid-2 { grid-template-columns: 1fr 1fr; }
    .post-images.grid-3 { grid-template-columns: 1fr 1fr 1fr; }
    .post-images img {
      width: 100%;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: transform 0.3s cubic-bezier(0.4,0,0.2,1), box-shadow 0.3s ease;
    }
    .post-images img:hover {
      transform: scale(1.03);
      box-shadow: 0 8px 24px rgba(100,170,230,0.15);
    }

    .post-location {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 14px;
    }

    .post-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      padding-top: 14px;
      border-top: 1px solid rgba(200,225,245,0.25);
    }

    /* ===== Lightbox ===== */
    .lightbox {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      cursor: zoom-out;
      animation: fadeIn 0.2s ease;
    }
    .lightbox.active { display: flex; }
    .lightbox img {
      max-width: 90vw;
      max-height: 90vh;
      border-radius: var(--radius-md);
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    /* ===== Empty State ===== */
    .empty-state {
      text-align: center;
      padding: 64px 24px;
      color: var(--text-muted);
    }
    .empty-state .empty-icon { font-size: 64px; margin-bottom: 16px; }
    .empty-state .empty-text {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-secondary);
    }
    .empty-state .empty-hint {
      font-size: 13px;
      font-weight: 600;
      margin-top: 8px;
    }

    /* ===== Toast ===== */
    .toast {
      position: fixed;
      top: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      padding: 12px 28px;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-primary);
      box-shadow: var(--shadow-hover);
      z-index: 2000;
      opacity: 0;
      transition: transform 0.35s, opacity 0.35s;
      pointer-events: none;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ===== Confirm Modal ===== */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.35);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 1500;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.2s ease;
    }
    .modal-overlay.active { display: flex; }
    .modal-box {
      background: var(--card-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 36px;
      max-width: 400px;
      width: 90%;
      box-shadow: var(--shadow-hover);
      text-align: center;
    }
    .modal-box h3 {
      font-size: 18px;
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 10px;
    }
    .modal-box p {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 24px;
      line-height: 1.6;
    }
    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    /* ===== Responsive ===== */
    @media (max-width: 640px) {
      .daily-header { padding: 10px 16px; }
      .daily-header h1 { font-size: 18px; }
      .container { padding: 16px 12px 60px; }
      .post-card { padding: 18px; border-radius: 20px; }
      .post-form-card { padding: 20px; border-radius: 20px; }
      .mood-option { width: 46px; height: 46px; font-size: 24px; }
      .post-images.grid-3 { grid-template-columns: 1fr 1fr; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="daily-header">
    <div class="header-left">
      <button class="back-btn" onclick="goBack()" title="返回">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        返回
      </button>
      <h1>&#9729;&#65039; 我的日常</h1>
    </div>
    <div class="header-right">
      <button class="btn btn-primary" id="newPostBtn" style="display:none;" onclick="togglePostForm()">+ 发帖</button>
    </div>
  </header>

  <!-- Toast -->
  <div class="toast" id="toast" role="alert"></div>

  <!-- Confirm Modal -->
  <div class="modal-overlay" id="confirmModal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <div class="modal-box">
      <h3 id="confirmTitle">确认操作</h3>
      <p id="confirmMessage">确定要执行此操作吗？</p>
      <div class="modal-actions">
        <button class="btn btn-outline" onclick="closeConfirm()">取消</button>
        <button class="btn btn-danger" id="confirmOkBtn" onclick="confirmAction()">确定</button>
      </div>
    </div>
  </div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="图片预览" onclick="closeLightbox()">
    <img id="lightboxImg" src="" alt="">
  </div>

  <div class="container">
    <!-- Admin toggle -->
    <div class="admin-bar">
      <label for="adminToggle">
        <input type="checkbox" id="adminToggle" onchange="toggleAdmin()">
        管理员模式
      </label>
      <span style="font-size:12px;color:#b0c4de;">(开启后可发帖和管理)</span>
    </div>

    <!-- Data management -->
    <div class="data-bar">
      <button class="btn btn-outline btn-sm" onclick="exportData()">&#128190; 导出数据</button>
      <button class="btn btn-outline btn-sm" onclick="document.getElementById('importFile').click()">&#128194; 导入数据</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
      <span id="postCount"></span>
    </div>

    <!-- Post form -->
    <div class="post-form-card" id="postFormCard">
      <div class="form-group">
        <label for="postContent">分享你的日常…</label>
        <textarea id="postContent" placeholder="今天发生了什么有趣的事？"></textarea>
      </div>

      <div class="form-group">
        <label for="moodSelector">心情状态</label>
        <div class="mood-selector" id="moodSelector">
          <div class="mood-option" data-mood="😊" tabindex="0" role="radio" aria-checked="false" aria-label="开心" onclick="selectMood(this)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();selectMood(this);}">
            <span>😊</span>
          </div>
          <div class="mood-option" data-mood="😢" tabindex="0" role="radio" aria-checked="false" aria-label="伤心" onclick="selectMood(this)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();selectMood(this);}">
            <span>😢</span>
          </div>
          <div class="mood-option" data-mood="😡" tabindex="0" role="radio" aria-checked="false" aria-label="生气" onclick="selectMood(this)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();selectMood(this);}">
            <span>😡</span>
          </div>
          <div class="mood-option" data-mood="🤔" tabindex="0" role="radio" aria-checked="false" aria-label="思考" onclick="selectMood(this)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();selectMood(this);}">
            <span>🤔</span>
          </div>
          <div class="mood-option" data-mood="😴" tabindex="0" role="radio" aria-checked="false" aria-label="困倦" onclick="selectMood(this)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();selectMood(this);}">
            <span>😴</span>
          </div>
          <div class="mood-option" data-mood="🎉" tabindex="0" role="radio" aria-checked="false" aria-label="庆祝" onclick="selectMood(this)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();selectMood(this);}">
            <span>🎉</span>
          </div>
          <div class="mood-option" data-mood="😌" tabindex="0" role="radio" aria-checked="false" aria-label="平静" onclick="selectMood(this)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();selectMood(this);}">
            <span>😌</span>
          </div>
          <div class="mood-option" data-mood="🥰" tabindex="0" role="radio" aria-checked="false" aria-label="喜爱" onclick="selectMood(this)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();selectMood(this);}">
            <span>🥰</span>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label for="postLocation">位置信息</label>
        <input type="text" id="postLocation" placeholder="你在哪里？（选填）">
      </div>

      <div class="form-group">
        <label for="postTime">发布时间</label>
        <input type="datetime-local" id="postTime">
      </div>

      <div class="form-group">
        <label for="imageInput">图片</label>
        <div class="image-upload-area" id="imageUploadArea" tabindex="0" role="button" aria-label="上传图片" onclick="document.getElementById('imageInput').click()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();document.getElementById('imageInput').click();}">
          <div class="upload-icon">&#128247;</div>
          <div class="upload-text">点击上传图片</div>
          <div class="upload-hint">支持 JPG、PNG、GIF，最多 9 张</div>
        </div>
        <input type="file" id="imageInput" accept="image/*" multiple style="display:none" onchange="handleImageUpload(event)">
        <div class="image-previews" id="imagePreviews"></div>
      </div>

      <div class="form-actions">
        <button class="btn btn-outline" onclick="togglePostForm()">取消</button>
        <button class="btn btn-rainbow" onclick="submitPost()">发布</button>
      </div>
    </div>

    <!-- Posts list -->
    <div id="postsList"></div>
  </div>

  <script>
    // ===== State =====
    let posts = [];
    let isAdmin = false;
    let editingPostId = null;
    let selectedMood = '';
    let uploadedImages = []; // base64 array
    let pendingConfirmCallback = null;

    const STORAGE_KEY = 'daily_posts';
    const ADMIN_KEY = 'daily_admin';

    // ===== Navigation =====
    function goBack() {
      // 如果在 iframe 中，通知父页面关闭覆盖层
      if (window.parent !== window) {
        window.parent.postMessage('closeDailyOverlay', '*');
      } else {
        // 直接访问时返回首页
        window.location.href = '/';
      }
    }

    // ===== Init =====
    function init() {
      // Load admin state
      const savedAdmin = localStorage.getItem(ADMIN_KEY);
      if (savedAdmin === 'true') {
        isAdmin = true;
        document.getElementById('adminToggle').checked = true;
        document.getElementById('newPostBtn').style.display = '';
      }

      // Set default time to now
      const now = new Date();
      const offset = now.getTimezoneOffset();
      const local = new Date(now.getTime() - offset * 60000);
      document.getElementById('postTime').value = local.toISOString().slice(0, 16);

      loadPosts();
      renderPosts();
    }

    // ===== Data persistence (localStorage) =====
    function loadPosts() {
      // Try localStorage first
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          posts = JSON.parse(saved);
          return;
        } catch(e) {}
      }
      // Fallback: fetch from JSON file
      fetch('/data/posts.json')
        .then(r => r.json())
        .then(data => {
          posts = data || [];
          savePosts();
          renderPosts();
        })
        .catch(() => {
          posts = [];
          renderPosts();
        });
    }

    function savePosts() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(posts));
    }

    // ===== Admin =====
    function toggleAdmin() {
      isAdmin = document.getElementById('adminToggle').checked;
      localStorage.setItem(ADMIN_KEY, isAdmin);
      document.getElementById('newPostBtn').style.display = isAdmin ? '' : 'none';
      // Hide form if turning off admin
      if (!isAdmin) {
        document.getElementById('postFormCard').classList.remove('visible');
      }
      renderPosts();
    }

    // ===== Post form =====
    function togglePostForm() {
      const card = document.getElementById('postFormCard');
      if (card.classList.contains('visible')) {
        card.classList.remove('visible');
        resetForm();
      } else {
        card.classList.add('visible');
        // Set default time
        const now = new Date();
        const offset = now.getTimezoneOffset();
        const local = new Date(now.getTime() - offset * 60000);
        document.getElementById('postTime').value = local.toISOString().slice(0, 16);
      }
    }

    function resetForm() {
      document.getElementById('postContent').value = '';
      document.getElementById('postLocation').value = '';
      selectedMood = '';
      uploadedImages = [];
      editingPostId = null;
      document.querySelectorAll('.mood-option').forEach(el => el.classList.remove('selected'));
      document.getElementById('imagePreviews').innerHTML = '';
    }

    // ===== Mood selector =====
    function selectMood(el) {
      document.querySelectorAll('.mood-option').forEach(o => {
        o.classList.remove('selected');
        o.setAttribute('aria-checked', 'false');
      });
      el.classList.add('selected');
      el.setAttribute('aria-checked', 'true');
      selectedMood = el.dataset.mood;
    }

    // ===== Image upload =====
    function handleImageUpload(event) {
      const files = Array.from(event.target.files);
      const remaining = 9 - uploadedImages.length;
      if (remaining <= 0) {
        showToast('最多上传 9 张图片');
        return;
      }
      const toProcess = files.slice(0, remaining);
      toProcess.forEach(file => {
        if (!file.type.startsWith('image/')) return;
        const reader = new FileReader();
        reader.onload = function(e) {
          // Compress by resizing to max 800px
          compressImage(e.target.result, 800, 0.8, function(compressed) {
            uploadedImages.push(compressed);
            renderImagePreviews();
          });
        };
        reader.readAsDataURL(file);
      });
      // Reset input
      event.target.value = '';
    }

    function compressImage(dataUrl, maxW, quality, callback) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        let w = img.width, h = img.height;
        if (w > maxW) { h = h * maxW / w; w = maxW; }
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        callback(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = dataUrl;
    }

    function renderImagePreviews() {
      const container = document.getElementById('imagePreviews');
      container.innerHTML = uploadedImages.map((img, i) => `
        <div class="image-preview-item">
          <img src="${img}" alt="预览 ${i+1}">
          <button class="remove-img" aria-label="删除图片" onclick="removeImage(${i})">&times;</button>
        </div>
      `).join('');
    }

    function removeImage(index) {
      uploadedImages.splice(index, 1);
      renderImagePreviews();
    }

    // ===== Submit post =====
    function submitPost() {
      const content = document.getElementById('postContent').value.trim();
      if (!content) {
        showToast('请输入内容');
        return;
      }

      const timeVal = document.getElementById('postTime').value;
      const createdAt = timeVal ? new Date(timeVal).toISOString() : new Date().toISOString();
      const location = document.getElementById('postLocation').value.trim();

      if (editingPostId) {
        // Edit existing post
        const idx = posts.findIndex(p => p.id === editingPostId);
        if (idx !== -1) {
          posts[idx].content = content;
          posts[idx].mood = selectedMood;
          posts[idx].location = location;
          posts[idx].images = [...uploadedImages];
          posts[idx].createdAt = createdAt;
        }
        showToast('帖子已更新');
      } else {
        // New post
        const post = {
          id: Date.now().toString(),
          content: content,
          images: [...uploadedImages],
          location: location,
          mood: selectedMood,
          pinned: false,
          createdAt: createdAt
        };
        posts.unshift(post);
        showToast('发布成功');
      }

      savePosts();
      renderPosts();
      togglePostForm();
    }

    // ===== Render posts =====
    function renderPosts() {
      const container = document.getElementById('postsList');
      const countEl = document.getElementById('postCount');
      countEl.textContent = `共 ${posts.length} 条动态`;

      if (posts.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">&#9729;&#65039;</div>
            <div class="empty-text">还没有任何动态</div>
            <div class="empty-hint">开启管理员模式来发布第一条动态吧</div>
          </div>
        `;
        return;
      }

      // Sort: pinned first, then by time desc
      const sorted = [...posts].sort((a, b) => {
        if (a.pinned && !b.pinned) return -1;
        if (!a.pinned && b.pinned) return 1;
        return new Date(b.createdAt) - new Date(a.createdAt);
      });

      container.innerHTML = sorted.map(post => {
        const timeStr = formatTime(post.createdAt);
        const imagesHtml = post.images && post.images.length > 0
          ? `<div class="post-images grid-${Math.min(post.images.length, 3)}">
              ${post.images.map(img => `<img src="${img}" alt="帖子图片" loading="lazy" onclick="openLightbox('${img.replace(/'/g, "\\'")}')">`).join('')}
            </div>`
          : '';
        const moodHtml = post.mood
          ? `<div class="post-mood">心情：${post.mood}</div>`
          : '';
        const locationHtml = post.location
          ? `<div class="post-location">&#128205; ${escapeHtml(post.location)}</div>`
          : '';
        const pinHtml = post.pinned
          ? `<div class="post-pin-badge">&#128204; 置顶</div>`
          : '';
        const adminActions = isAdmin ? `
          <div class="post-actions">
            <button class="btn btn-outline btn-sm" onclick="editPost('${post.id}')">&#9998; 编辑</button>
            <button class="btn btn-outline btn-sm" onclick="togglePin('${post.id}')">${post.pinned ? '&#128205; 取消置顶' : '&#128204; 置顶'}</button>
            <button class="btn btn-danger btn-sm" onclick="deletePost('${post.id}')">&#128465; 删除</button>
          </div>
        ` : '';

        return `
          <div class="post-card ${post.pinned ? 'pinned' : ''}">
            <div class="post-header">
              <div class="post-meta">
                <img class="post-avatar" src="/images/avatar.png" alt="头像" width="44" height="44" loading="lazy">
                <div class="post-info">
                  <div class="post-name">宁小包</div>
                  <div class="post-time">${timeStr}</div>
                </div>
              </div>
              ${pinHtml}
            </div>
            <div class="post-content">${escapeHtml(post.content)}</div>
            ${moodHtml}
            ${imagesHtml}
            ${locationHtml}
            ${adminActions}
          </div>
        `;
      }).join('');
    }

    // ===== Post actions =====
    function editPost(id) {
      const post = posts.find(p => p.id === id);
      if (!post) return;
      editingPostId = id;
      document.getElementById('postContent').value = post.content;
      document.getElementById('postLocation').value = post.location || '';
      selectedMood = post.mood || '';
      uploadedImages = post.images ? [...post.images] : [];

      // Set time
      if (post.createdAt) {
        const d = new Date(post.createdAt);
        const offset = d.getTimezoneOffset();
        const local = new Date(d.getTime() - offset * 60000);
        document.getElementById('postTime').value = local.toISOString().slice(0, 16);
      }

      // Update mood selector
      document.querySelectorAll('.mood-option').forEach(el => {
        const isSelected = el.dataset.mood === selectedMood;
        el.classList.toggle('selected', isSelected);
        el.setAttribute('aria-checked', isSelected ? 'true' : 'false');
      });
      renderImagePreviews();

      // Show form
      const card = document.getElementById('postFormCard');
      card.classList.add('visible');
      card.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function togglePin(id) {
      const post = posts.find(p => p.id === id);
      if (!post) return;
      post.pinned = !post.pinned;
      savePosts();
      renderPosts();
      showToast(post.pinned ? '已置顶' : '已取消置顶');
    }

    function deletePost(id) {
      showConfirm('删除帖子', '确定要删除这条动态吗？此操作不可撤销。', function() {
        posts = posts.filter(p => p.id !== id);
        savePosts();
        renderPosts();
        showToast('已删除');
      });
    }

    // ===== Export / Import =====
    function exportData() {
      const dataStr = JSON.stringify(posts, null, 2);
      const blob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'daily-posts-' + new Date().toISOString().slice(0, 10) + '.json';
      a.click();
      URL.revokeObjectURL(url);
      showToast('数据已导出');
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = JSON.parse(e.target.result);
          if (!Array.isArray(data)) {
            showToast('数据格式错误');
            return;
          }
          showConfirm('导入数据', `将导入 ${data.length} 条动态，当前数据将被替换。确定继续？`, function() {
            posts = data;
            savePosts();
            renderPosts();
            showToast(`成功导入 ${data.length} 条动态`);
          });
        } catch(err) {
          showToast('文件解析失败，请检查 JSON 格式');
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    // ===== Lightbox =====
    function openLightbox(src) {
      document.getElementById('lightboxImg').src = src;
      document.getElementById('lightbox').classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('active');
      document.body.style.overflow = '';
    }

    // ===== Confirm modal =====
    function showConfirm(title, message, callback) {
      document.getElementById('confirmTitle').textContent = title;
      document.getElementById('confirmMessage').textContent = message;
      pendingConfirmCallback = callback;
      document.getElementById('confirmModal').classList.add('active');
    }

    function closeConfirm() {
      document.getElementById('confirmModal').classList.remove('active');
      pendingConfirmCallback = null;
    }

    function confirmAction() {
      if (pendingConfirmCallback) pendingConfirmCallback();
      closeConfirm();
    }

    // ===== Toast =====
    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 2500);
    }

    // ===== Utilities =====
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function formatTime(isoStr) {
      try {
        const d = new Date(isoStr);
        const now = new Date();
        const diff = now - d;
        const minutes = Math.floor(diff / 60000);
        const hours = Math.floor(diff / 3600000);
        const days = Math.floor(diff / 86400000);

        if (minutes < 1) return '刚刚';
        if (minutes < 60) return `${minutes} 分钟前`;
        if (hours < 24) return `${hours} 小时前`;
        if (days < 7) return `${days} 天前`;

        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        const h = String(d.getHours()).padStart(2, '0');
        const min = String(d.getMinutes()).padStart(2, '0');
        return `${y}-${m}-${day} ${h}:${min}`;
      } catch(e) {
        return isoStr;
      }
    }

    // ===== Keyboard shortcuts =====
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        closeLightbox();
        closeConfirm();
      }
    });

    // ===== Start =====
    init();
  </script>
</body>
</html>
