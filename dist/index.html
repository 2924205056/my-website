<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>宁小包</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <script>
    // 确保 React Router 收到干净的路径 /
    if (window.location.pathname !== '/' && !window.location.pathname.endsWith('.html')) {
      // nothing
    } else if (window.location.pathname.endsWith('index.html')) {
      window.history.replaceState(null, '', './');
    }
  </script>
  <script type="module" crossorigin src="./assets/index-Dg24nuQD.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-DeZ8CYAY.css">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>

  <style>
    section:has(h2):has(img[alt="小康云"]) > div:has(h2) {
      display: none !important;
    }

    section:has(h2):has(img[alt="小康云"]) {
      display: block !important;
      grid-template-columns: 1fr !important;
    }

    section:has(h2):has(img[alt="小康云"]) > div:has(> img[alt="小康云"]):not(.about-glass-surface),
    section.reveal-section.grid.gap-6 > div:nth-child(2):has(> img[alt="小康云"]):not(.about-glass-surface) {
      display: none !important;
    }

    /* ========================================
       增强版梦幻粒子动画系统
       ======================================== */
    
    /* 爱心飘浮 */
    @keyframes heart-float {
      0% {
        transform: translateY(0) translateX(0) rotate(0deg) scale(0);
        opacity: 0;
      }
      5% {
        opacity: 0.8;
        transform: translateY(-5vh) translateX(5px) rotate(15deg) scale(1);
      }
      25% {
        transform: translateY(-25vh) translateX(-10px) rotate(-10deg) scale(1.1);
      }
      50% {
        transform: translateY(-50vh) translateX(15px) rotate(20deg) scale(0.9);
        opacity: 0.6;
      }
      75% {
        transform: translateY(-75vh) translateX(-8px) rotate(-15deg) scale(1.05);
        opacity: 0.4;
      }
      95% {
        opacity: 0.2;
      }
      100% {
        transform: translateY(-110vh) translateX(10px) rotate(30deg) scale(0.8);
        opacity: 0;
      }
    }
    
    /* 星星闪烁 */
    @keyframes star-twinkle {
      0%, 100% {
        opacity: 0.15;
        transform: translateY(0) scale(0.8) rotate(0deg);
        filter: blur(0px);
      }
      50% {
        opacity: 1;
        transform: translateY(-8vh) scale(1.3) rotate(180deg);
        filter: blur(0.5px);
        box-shadow: 0 0 20px rgba(255, 215, 0, 0.8), 0 0 40px rgba(255, 255, 255, 0.4);
      }
    }
    
    /* 泡泡飘动 */
    @keyframes bubble-float {
      0% {
        transform: translateY(100vh) translateX(0) scale(0.5);
        opacity: 0;
      }
      10% {
        opacity: 0.6;
        transform: translateY(90vh) translateX(10px) scale(0.8);
      }
      40% {
        transform: translateY(60vh) translateX(-15px) scale(1);
        opacity: 0.5;
      }
      70% {
        transform: translateY(30vh) translateX(20px) scale(0.9);
        opacity: 0.4;
      }
      100% {
        transform: translateY(-10vh) translateX(-5px) scale(0.7);
        opacity: 0;
      }
    }
    
    /* 泡泡光晕 */
    @keyframes bubble-shine {
      0%, 100% {
        background: radial-gradient(circle at 30% 30%, 
          rgba(255, 255, 255, 0.9) 0%, 
          rgba(135, 206, 250, 0.4) 30%, 
          rgba(135, 206, 250, 0.1) 60%, 
          transparent 80%);
      }
      50% {
        background: radial-gradient(circle at 70% 70%, 
          rgba(255, 255, 255, 0.9) 0%, 
          rgba(255, 182, 193, 0.4) 30%, 
          rgba(255, 182, 193, 0.1) 60%, 
          transparent 80%);
      }
    }
    
    /* 柔光漂浮 */
    @keyframes soft-glow-drift {
      0%, 100% {
        opacity: 0.08;
        transform: translateY(0) translateX(0) scale(1);
      }
      33% {
        opacity: 0.15;
        transform: translateY(-20vh) translateX(30px) scale(1.1);
      }
      66% {
        opacity: 0.1;
        transform: translateY(-40vh) translateX(-20px) scale(0.95);
      }
    }
    
    /* 花瓣旋转 */
    @keyframes petal-fall {
      0% {
        transform: translateY(-10vh) translateX(0) rotate(0deg);
        opacity: 0;
      }
      10% {
        opacity: 0.7;
      }
      90% {
        opacity: 0.5;
      }
      100% {
        transform: translateY(110vh) translateX(50px) rotate(360deg);
        opacity: 0;
      }
    }
    
    /* 主容器 */
    .magical-particles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 20;
      overflow: hidden;
    }
    
    /* 爱心 */
    .magic-heart {
      position: absolute;
      bottom: -60px;
      animation: heart-float linear infinite;
      filter: drop-shadow(0 0 10px currentColor);
    }
    
    /* 星星 */
    .magic-star {
      position: absolute;
      bottom: -30px;
      animation: star-twinkle ease-in-out infinite;
    }
    
    .magic-star::before {
      content: '';
      position: absolute;
      inset: 0;
      background: inherit;
      border-radius: 50%;
    }
    
    /* 泡泡 */
    .magic-bubble {
      position: absolute;
      bottom: -80px;
      border-radius: 50%;
      animation: bubble-float linear infinite;
      animation-name: bubble-float, bubble-shine;
      animation-duration: inherit, 4s;
      animation-timing-function: linear, ease-in-out;
      animation-iteration-count: infinite, infinite;
    }
    
    /* 柔光 */
    .magic-glow {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle,
        rgba(180, 215, 250, 0.25) 0%,
        rgba(200, 230, 255, 0.15) 40%,
        transparent 70%);
      animation: soft-glow-drift ease-in-out infinite;
      filter: blur(30px);
    }
    
    /* 花瓣 */
    .magic-petal {
      position: absolute;
      bottom: -40px;
      animation: petal-fall linear infinite;
    }

    /* 云絮飘浮 */
    @keyframes cloudpuff-drift {
      0% {
        transform: translateX(0) translateY(0) scale(0.3);
        opacity: 0;
      }
      8% {
        opacity: 0.45;
        transform: scale(1);
      }
      85% {
        opacity: 0.3;
      }
      100% {
        transform: translateX(var(--drift-x, 80px)) translateY(var(--drift-y, -120px)) scale(0.7);
        opacity: 0;
      }
    }

    .magic-cloudpuff {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, rgba(255, 255, 255, 0.75) 0%, rgba(220, 238, 255, 0.35) 35%, rgba(180, 215, 250, 0.08) 65%, transparent 80%);
      filter: blur(6px);
      animation: cloudpuff-drift var(--dur, 18s) ease-out forwards;
    }

    /* 光点飘浮 */
    @keyframes speck-float {
      0%, 100% { transform: translateY(0) translateX(0) scale(1); opacity: 0.35; }
      33% { transform: translateY(var(--sy1, -15px)) translateX(var(--sx1, 10px)) scale(0.8); opacity: 0.55; }
      66% { transform: translateY(var(--sy2, -25px)) translateX(var(--sx2, -8px)) scale(1.2); opacity: 0.25; }
    }

    .magic-speck {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.8);
      box-shadow: 0 0 6px rgba(180, 215, 250, 0.5);
      animation: speck-float var(--dur, 8s) ease-in-out infinite;
      animation-delay: var(--delay, 0s);
    }

    /* ========================================
       Cloud Glider - 滑板云动画
       ======================================== */

    /* 整体飘浮 */
    @keyframes cg-float {
      0%, 100% { transform: translateY(0) rotate(-1.5deg); }
      30% { transform: translateY(-20px) rotate(1deg); }
      60% { transform: translateY(-10px) rotate(-0.5deg); }
    }

    /* 眨眼 */
    @keyframes cg-blink {
      0%, 42%, 46%, 100% { transform: scaleY(1); }
      44% { transform: scaleY(0.08); }
    }

    /* 彩虹尾迹飘动 */
    @keyframes cg-trail-wave {
      0%, 100% { transform: scaleX(1) rotate(0deg); opacity: 0.85; }
      50% { transform: scaleX(1.08) rotate(1deg); opacity: 1; }
    }

    /* 尾迹星星闪烁 */
    @keyframes cg-sparkle {
      0%, 100% { opacity: 0.2; transform: scale(0.6) rotate(0deg); }
      50% { opacity: 1; transform: scale(1.3) rotate(180deg); }
    }

    /* 风线 */
    @keyframes cg-wind {
      0% { transform: translateX(0) scaleX(0.3); opacity: 0; }
      20% { opacity: 0.7; }
      100% { transform: translateX(-120px) scaleX(1.2); opacity: 0; }
    }

    /* 背景云层漂移 */
    @keyframes cg-cloud-drift {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }

    /* 伴飞元素 */
    @keyframes cg-companion-fly {
      from { left: 105%; }
      to { left: -15%; }
    }
    @keyframes cg-companion-bob {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25% { transform: translateY(-18px) rotate(8deg); }
      75% { transform: translateY(-18px) rotate(-8deg); }
    }

    /* 地面波浪 */
    @keyframes cg-ground {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(8px); }
    }

    /* 光晕呼吸 */
    @keyframes cg-glow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(1.1); }
    }

    /* 进入动画 */
    @keyframes cg-enter {
      0% { opacity: 0; transform: translateX(80px); }
      100% { opacity: 1; transform: translateX(0); }
    }

    @keyframes hero-cloud-drift {
      0% { transform: translateX(-18vw) translateY(0) scale(var(--scale, 1)); opacity: 0; }
      12% { opacity: var(--opacity, 0.55); }
      88% { opacity: var(--opacity, 0.55); }
      100% { transform: translateX(78vw) translateY(var(--rise, -18px)) scale(var(--scale, 1)); opacity: 0; }
    }

    @keyframes hero-float-pop {
      0%, 100% { transform: translateY(0) rotate(-6deg) scale(var(--scale, 1)); }
      50% { transform: translateY(-16px) rotate(7deg) scale(var(--scale, 1)); }
    }

    .cloud-hero-section {
      isolation: isolate;
    }

    .hero-btn-primary:hover {
      background: #2a4578 !important;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(49,80,141,0.35) !important;
    }

    .hero-btn-outline:hover {
      background: rgba(255,255,255,0.95) !important;
      transform: translateY(-2px);
      border-color: #31508d !important;
    }

    /* 导航栏统一样式 - 移除自定义，交给JS匹配原版 */

    /* 隐藏GSAP ScrollTrigger调试指示器（绿色/红色滚动标记） */
    [class*="ScrollTrigger"],
    [class*="scroll-trigger"],
    [class*="gsap"],
    div[style*="green"],
    div[style*="background-color: green"],
    div[style*="background: green"],
    div[style*="background-color:green"],
    div[style*="background:green"] {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }

    /* 隐藏右下角/左下角浮动组件 */
    #root .fixed.bottom-4,
    #root .fixed.bottom-0,
    #root .fixed.right-4,
    #root .fixed.right-0,
    #root .fixed.right-6,
    #root .fixed.right-3,
    #root .fixed.bottom-6,
    #root .fixed.bottom-16,
    #root .fixed.bottom-20,
    #root .fixed.bottom-24,
    #root [class*="fixed"][class*="bottom"][class*="right"],
    #root [class*="bottom-4"][class*="right"],
    #root [class*="bottom-6"][class*="right"],
    #root [class*="right-4"][class*="bottom"],
    #root [class*="right-6"][class*="bottom"],
    #root button[class*="fixed"],
    #root a[class*="fixed"] {
      display: none !important;
    }

    .cloud-hero-section > .relative.grid {
      z-index: 3;
    }

    .hero-float-layer {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
      border-radius: 40px;
    }

    .hero-float-cloud {
      position: absolute;
      top: var(--top);
      left: var(--left);
      width: var(--w);
      height: calc(var(--w) * 0.42);
      border-radius: 999px;
      background:
        radial-gradient(circle at 28% 34%, rgba(255,255,255,0.82), rgba(255,255,255,0.54) 38%, rgba(255,255,255,0) 70%),
        radial-gradient(circle at 58% 22%, rgba(255,255,255,0.72), rgba(255,255,255,0.5) 36%, rgba(255,255,255,0) 68%),
        radial-gradient(circle at 78% 48%, rgba(255,255,255,0.66), rgba(255,255,255,0.38) 34%, rgba(255,255,255,0) 70%);
      box-shadow:
        0 18px 42px rgba(128,179,230,0.08),
        inset 0 1px 0 rgba(255,255,255,0.8);
      filter: blur(8px);
      animation: hero-cloud-drift var(--dur) linear infinite;
      animation-delay: var(--delay);
    }

    .hero-float-cloud::before,
    .hero-float-cloud::after {
      content: none;
    }

    .hero-float-heart {
      position: absolute;
      top: var(--top);
      left: var(--left);
      width: var(--size);
      height: var(--size);
      transform: rotate(-45deg);
      background: rgba(244,112,180,0.64);
      border-radius: 30% 30% 12% 30%;
      box-shadow: 0 10px 24px rgba(235,109,170,0.18);
      animation: hero-float-pop var(--dur) ease-in-out infinite;
      animation-delay: var(--delay);
    }

    .hero-float-heart::before,
    .hero-float-heart::after {
      content: "";
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: inherit;
    }

    .hero-float-heart::before { top: -50%; left: 0; }
    .hero-float-heart::after { top: 0; left: 50%; }

    /* 停掉React hero自身的动画效果 */
    .cloud-hero-section .hero-float-cloud,
    .cloud-hero-section .hero-float-heart,
    .cloud-hero-section .hero-float-star {
      display: none !important;
    }

    .hero-float-star {
      position: absolute;
      top: var(--top);
      left: var(--left);
      width: var(--size);
      height: var(--size);
      opacity: var(--opacity, 0.68);
      animation: hero-float-pop var(--dur) ease-in-out infinite;
      animation-delay: var(--delay);
    }

    .hero-float-star::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(255,221,86,0.82);
      clip-path: polygon(50% 0%, 61% 36%, 98% 50%, 61% 64%, 50% 100%, 39% 64%, 2% 50%, 39% 36%);
      filter: drop-shadow(0 8px 12px rgba(245,190,70,0.16));
    }

    .hero-float-star.is-white::before {
      background: rgba(255,255,255,0.86);
      filter: drop-shadow(0 8px 12px rgba(119,172,228,0.14));
    }

    /* ========================================
       容器
       ======================================== */
    #cloud-glider {
      position: absolute;
      top: 120px;
      right: 6vw;
      width: min(42vw, 620px);
      height: 440px;
      z-index: 2;
      pointer-events: none;
      overflow: visible;
      animation: cg-enter 1s ease-out;
    }

    #cloud-glider.cg-home-glider {
      position: relative;
      width: min(100%, 640px);
      height: clamp(260px, 28vw, 400px);
      z-index: 12;
    }

    /* 隐藏滑板云背景粒子 */
    #cg-bg1, #cg-bg2, #cg-mid1, #cg-mid2, #cg-fg1, #cg-fg2,
    #cg-companions, .cg-trail-sparkle, .cg-wind-lines, .cg-deco-wind,
    .cg-deco-line, .cg-companion { display: none !important; }
    .cg-hero-host {
      align-items: center;
      justify-content: center;
      overflow: visible !important;
      position: relative;
    }
    /* Lottie 动画已替换为云朵家族角色网格 */

    /* ========================================
       云朵家族 Hero 区 Lottie 动画
       ======================================== */
    @keyframes cf-hero-name-in {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #cloud-family-hero-wrap {
      position: relative;
      width: 100%;
      max-width: 360px;
      z-index: 10;
      padding: 6px;
    }

    .cf-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      width: 100%;
    }

    .cf-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      animation: cf-float 3s ease-in-out infinite;
    }
    .cf-card:nth-child(1) { animation-delay: 0s; }
    .cf-card:nth-child(2) { animation-delay: 0.7s; }
    .cf-card:nth-child(3) { animation-delay: 1.4s; }
    .cf-card:nth-child(4) { animation-delay: 2.1s; }

    .cf-card img {
      width: 100%;
      max-height: 130px;
      height: auto;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 4px 12px rgba(91, 155, 213, 0.25));
      transition: transform 0.3s ease;
    }
    .cf-card:hover img { transform: scale(1.05); }

    .cf-label {
      margin-top: 4px;
      pointer-events: auto;
      cursor: pointer;
      transition: transform 0.3s ease;
    }
    .cf-label:hover { transform: scale(1.08); }

    .cf-label-name {
      font-family: 'Space Mono', monospace;
      font-size: 0.85rem;
      font-weight: 700;
      color: #31508d;
      letter-spacing: 0.04em;
      text-shadow: 0 1px 4px rgba(255,255,255,0.8);
      animation: cf-hero-name-in 0.5s ease-out both;
    }

    .cf-label-tag {
      display: inline-block;
      font-family: 'Space Mono', monospace;
      font-size: 0.6rem;
      color: var(--card-accent, #5b9bd5);
      background: rgba(255,255,255,0.6);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border-radius: 999px;
      padding: 1px 6px;
      margin-top: 2px;
      border: 1px solid rgba(255,255,255,0.5);
      animation: cf-hero-name-in 0.5s ease-out 0.1s both;
    }

    @keyframes cf-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    /* 响应式适配 */
    @media (max-width: 768px) {
      #cloud-family-hero-wrap { max-width: 280px; padding: 5px; }
      .cf-grid { gap: 8px; }
      .cf-label-name { font-size: 0.65rem; }
      .cf-label-tag { font-size: 0.48rem; padding: 1px 6px; }
    }
    @media (max-width: 480px) {
      #cloud-family-hero-wrap { max-width: 220px; padding: 4px; }
      .cf-grid { gap: 6px; }
      .cf-label-name { font-size: 0.55rem; }
      .cf-label-tag { font-size: 0.42rem; padding: 1px 5px; }
    }

    .cg-sky {
      position: absolute;
      inset: 0;
      background: transparent;
      border: 0;
      border-radius: 0;
      box-shadow: none;
      overflow: visible;
    }

    /* ========================================
       背景云层
       ======================================== */
    .cg-cloud-layer {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .cg-cloud-track {
      display: flex;
      height: 100%;
      width: 200%;
      animation: cg-cloud-drift var(--speed) linear infinite;
    }
    .cg-cloud-group {
      display: flex;
      width: 100%;
      justify-content: space-around;
      align-items: flex-end;
      padding-bottom: 60px;
    }
    .cg-cloud-item {
      opacity: var(--opacity);
      filter: blur(2px);
      transform: scale(var(--scale));
    }

    /* ========================================
       滑板云角色
       ======================================== */
    .cg-skater-wrap {
      position: absolute;
      left: 50%;
      top: 43%;
      margin-left: -110px;
      transform: translateY(-50%);
      z-index: 30;
      animation: cg-float 3.5s ease-in-out infinite;
    }

    /* 光晕 */
    .cg-skater-glow {
      position: absolute;
      inset: -50px;
      background: radial-gradient(ellipse at center, rgba(135,206,250,0.22) 0%, rgba(255,255,255,0.08) 45%, transparent 70%);
      border-radius: 50%;
      filter: blur(18px);
      animation: cg-glow 4s ease-in-out infinite;
    }

    /* 角色主体（含白色贴纸边框） */
    .cg-character {
      position: relative;
      filter: drop-shadow(0 8px 24px rgba(100,150,200,0.3));
    }

    .cg-character > svg {
      display: none;
    }

    .cg-new-cloud {
      width: clamp(470px, 52vw, 760px);
      max-width: none;
      transform: translate(-206px, -190px);
      filter: drop-shadow(0 22px 30px rgba(90, 145, 205, 0.18));
    }

    /* 眨眼控制 */
    .cg-eye-pair {
      animation: cg-blink 4.5s ease-in-out infinite;
    }

    /* 彩虹尾迹 */
    .cg-rainbow-trail {
      position: absolute;
      left: -90px;
      top: 35%;
      transform-origin: right center;
      animation: cg-trail-wave 2s ease-in-out infinite;
    }

    /* 尾迹星星 */
    .cg-trail-sparkle {
      position: absolute;
      animation: cg-sparkle 2s ease-in-out infinite;
    }

    /* 风线 */
    .cg-wind-lines {
      position: absolute;
      left: -150px;
      top: 34%;
      pointer-events: none;
    }
    .cg-wind-line {
      position: absolute;
      height: 4px;

      window.saveFortuneConfig = async function() {
        var key = document.getElementById('fortune-api-key').value.trim();
        var endpoint = document.getElementById('fortune-api-endpoint').value.trim();
        var model = document.getElementById('fortune-model').value.trim();
        if (!key || !endpoint || !model) { alert('请填写 API Endpoint、Key 和模型名称'); return; }
        // 使用 Web Crypto 加密存储
        var encKey = await deriveKey('fortune-salt-2024');
        var iv = crypto.getRandomValues(new Uint8Array(12));
        var encoded = new TextEncoder().encode(key);
        var encrypted = await crypto.subtle.encrypt({name:'AES-GCM',iv:iv}, encKey, encoded);
        var combined = new Uint8Array(iv.length + new Uint8Array(encrypted).length);
        combined.set(iv); combined.set(new Uint8Array(encrypted), iv.length);
        var b64 = btoa(String.fromCharCode.apply(null, combined));
        localStorage.setItem('fortune_config', JSON.stringify({k:b64, endpoint:endpoint, model:model}));
        updateFortuneStatus(true);
        alert('✅ API Key 已加密保存（仅存于本机浏览器）');

      async function deriveKey(salt) {
        var keyMaterial = await crypto.subtle.importKey('raw', new TextEncoder().encode('cloud-fortune-key-2024'), 'PBKDF2', false, ['deriveKey']);
        return crypto.subtle.deriveKey({name:'PBKDF2', salt:new TextEncoder().encode(salt), iterations:100000, hash:'SHA-256'}, keyMaterial, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
      }

      async function decryptKey(encryptedB64) {
        try {
          var combined = new Uint8Array(atob(encryptedB64).split('').map(function(c){return c.charCodeAt(0)}));

          var data = combined.slice(12);
          var encKey = await deriveKey('fortune-salt-2024');
          var decrypted = await crypto.subtle.decrypt({name:'AES-GCM',iv:iv}, encKey, data);
          return new TextDecoder().decode(decrypted);

  <!-- Hero 区域 -->
  <script>
  (function() {
    /* 生成云朵 SVG */
    function cloudSVG(size) {
      const s = document.createElementNS('http://www.w3.org/2000/svg','svg');
      s.setAttribute('width', size);
      s.setAttribute('height', size * 0.55);
      s.setAttribute('viewBox','0 0 120 66');
      s.innerHTML = '<path d="M25,50 Q5,50 5,36 Q5,22 25,22 Q25,6 50,6 Q75,6 75,22 Q100,6 115,22 Q130,36 115,50 Q115,62 90,62 Q65,62 58,50 Q40,62 25,50Z" fill="white"/>';
      return s;
    }

    /* 填充云层 */
    function fillClouds(id, n, opacity, sMin, sMax) {
      const c = document.getElementById(id);
      if (!c) return;
      for (let i = 0; i < n; i++) {
        const w = document.createElement('div');
        w.className = 'cg-cloud-item';
        const sc = sMin + Math.random()*(sMax-sMin);
        const sz = 90 + Math.random()*70;
        w.style.cssText = '--opacity:'+opacity+';--scale:'+sc+';';
        w.appendChild(cloudSVG(sz));
        c.appendChild(w);
      }
    }
    fillClouds('cg-bg1',4,0.25,0.7,1.2);
    fillClouds('cg-bg2',4,0.25,0.7,1.2);
    fillClouds('cg-mid1',5,0.45,0.8,1.3);
    fillClouds('cg-mid2',5,0.45,0.8,1.3);
    fillClouds('cg-fg1',4,0.7,0.8,1.2);
    fillClouds('cg-fg2',4,0.7,0.8,1.2);

    const glider = document.getElementById('cloud-glider');
    function mountHeroFloatLayer(section) {
      if (!section || section.querySelector('.hero-float-layer')) return;
      section.classList.add('cloud-hero-section');

      const layer = document.createElement('div');
      layer.className = 'hero-float-layer';
      layer.innerHTML = `
        <span class="hero-float-cloud" style="--top:3%;--left:-18%;--w:230px;--dur:34s;--delay:-18s;--scale:1;--opacity:.62;--rise:-10px;"></span>
        <span class="hero-float-cloud" style="--top:9%;--left:20%;--w:165px;--dur:42s;--delay:-8s;--scale:.86;--opacity:.46;--rise:-24px;"></span>
        <span class="hero-float-cloud" style="--top:17%;--left:-8%;--w:120px;--dur:29s;--delay:-4s;--scale:.72;--opacity:.38;--rise:-16px;"></span>
        <span class="hero-float-cloud" style="--top:6%;--left:58%;--w:205px;--dur:38s;--delay:-25s;--scale:.94;--opacity:.48;--rise:-20px;"></span>
        <span class="hero-float-heart" style="--top:26%;--left:70%;--size:24px;--dur:4.8s;--delay:-1s;--scale:1;"></span>
        <span class="hero-float-heart" style="--top:14%;--left:84%;--size:15px;--dur:5.6s;--delay:-3s;--scale:.78;"></span>
        <span class="hero-float-heart" style="--top:43%;--left:57%;--size:13px;--dur:4.2s;--delay:-2s;--scale:.68;"></span>
      `;
      section.insertBefore(layer, section.firstChild);
    }

    function mountHomeGlider() {
      const heroImage = document.querySelector('img[alt="小康云滑板形象"]');
      if (!heroImage || !heroImage.parentElement) return;

      heroImage.style.display = 'none';
      var heroParent = heroImage.parentElement;
      heroParent.classList.add('cg-hero-host');
      // 调整为顶部对齐布局，最大化可视区域
      heroParent.style.display = 'flex';
      heroParent.style.alignItems = 'flex-start';
      heroParent.style.justifyContent = 'center';
      heroParent.style.paddingRight = '0';
      heroParent.style.paddingTop = '0';
      heroParent.style.position = 'relative';

      // 注入云朵家族到 Hero 右侧栏
      if (!document.getElementById('cloud-family-hero-wrap')) {
        var wrap = document.createElement('div');
        wrap.id = 'cloud-family-hero-wrap';

        var grid = document.createElement('div');
        grid.className = 'cf-grid';

        var chars = [
          { name: '云奔奔', tag: '🏃 冒险家', accent: '#FF8C42', img: '/images/cloud-char-1.png' },
          { name: '云卷卷', tag: '📚 学霸', accent: '#6BCB77', img: '/images/cloud-char-0.png' },
          { name: '云乐乐', tag: '🎵 开心果', accent: '#FF6B9D', img: '/images/cloud-char-2.png' },
          { name: '云小白', tag: '🎮 游戏迷', accent: '#4D96FF', img: '/images/cloud-char-3.png' }
        ];
        chars.forEach(function(ch) {
          var card = document.createElement('div');
          card.className = 'cf-card';
          card.innerHTML =
            '<img src="' + ch.img + '" alt="' + ch.name + '" loading="eager" draggable="false">' +
            '<div class="cf-label" style="--card-accent:' + ch.accent + ';">' +
              '<div class="cf-label-name">' + ch.name + '</div>' +
              '<span class="cf-label-tag">' + ch.tag + '</span>' +
            '</div>';
          grid.appendChild(card);
        });
        wrap.appendChild(grid);
        heroParent.appendChild(wrap);
      }

      if (glider) {
        glider.classList.add('cg-home-glider');
        glider.style.marginTop = '-100px';
      }

      var heroSection = heroImage.closest('section');
      if (heroSection) {
        heroSection.style.border = '2px solid rgba(255,255,255,0.7)';
        heroSection.style.borderRadius = '24px';
        heroSection.style.overflow = 'hidden';
        heroSection.style.isolation = 'isolate';
        // 把粒子容器移进hero section
        var particles = document.getElementById('magicalParticles');
        if (particles && !heroSection.contains(particles)) {
          heroSection.style.position = 'relative';
          heroSection.appendChild(particles);
        }
        // 停掉React hero内部所有动画(除了我们的粒子和云朵家族Lottie动画)
        heroSection.querySelectorAll('*').forEach(function(el) {
          if (el.id === 'magicalParticles' || el.id === 'cloud-family-hero-wrap' || el.id === 'lottie-cloud-grid') return;
          if (el.closest && (el.closest('#magicalParticles') || el.closest('#cloud-family-hero-wrap') || el.closest('#lottie-cloud-grid'))) return;
          var s = getComputedStyle(el);
          if (s.animationName && s.animationName !== 'none') {
            el.style.animation = 'none';
          }
        });
      }

      if (glider && !heroParent.contains(glider)) {
        heroParent.appendChild(glider);
      }

      // 放大左侧头像 (h-16→h-24, 64px→96px)
      var avatarImg = document.querySelector('img[alt="小康云"]');
      if (avatarImg) {
        avatarImg.style.width = '96px';
        avatarImg.style.height = '96px';
        avatarImg.classList.remove('h-16', 'w-16');
        avatarImg.classList.add('h-24', 'w-24');
        var avatarParent = avatarImg.parentElement;
        if (avatarParent) {
          avatarParent.style.width = '112px';
          avatarParent.style.height = '112px';
          avatarParent.classList.remove('h-18', 'w-18');
        }
      }

      // 优化 Footer 图标 (替换蓝色占位图为云朵角色，并适当放大)
      var footerImg = document.querySelector('footer img[alt=""]');
      if (footerImg && footerImg.src.indexOf('cloud-skater') !== -1) {
        footerImg.style.width = '52px';
        footerImg.style.height = '52px';
        footerImg.classList.remove('h-10', 'w-10');
        footerImg.classList.add('h-14', 'w-14');
      }
    }

    let mountAttempts = 0;
    const mountTimer = setInterval(() => {
      mountHomeGlider();
      mountAttempts += 1;
      if (mountAttempts > 24) clearInterval(mountTimer);
    }, 120);

    const root = document.getElementById('root');
    if (root) {
      new MutationObserver(mountHomeGlider).observe(root, { childList: true, subtree: true });
    }
    window.addEventListener('load', mountHomeGlider);

    /* 伴飞元素 */
    const types = [
      { svg: s=>`<svg width="${s}" height="${s}" viewBox="0 0 48 48"><circle cx="24" cy="24" r="11" fill="#facc15" stroke="#f59e0b" stroke-width="2"/><g stroke="#facc15" stroke-width="2.5" stroke-linecap="round">${[0,45,90,135,180,225,270,315].map(a=>`<line x1="24" y1="5" x2="24" y2="10" transform="rotate(${a} 24 24)"/>`).join('')}</g></svg>` },
      { svg: s=>`<svg width="${s}" height="${s}" viewBox="0 0 32 32"><path d="M16 0L20 12L32 16L20 20L16 32L12 20L0 16L12 12Z" fill="#fde047" stroke="#eab308" stroke-width="1"/></svg>` },
      { svg: s=>`<svg width="${s}" height="${s*0.6}" viewBox="0 0 36 22"><path d="M2,16 Q10,4 18,12 Q26,4 34,16" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/></svg>` },
      { svg: s=>`<svg width="${s}" height="${s*0.85}" viewBox="0 0 24 20"><path d="M12 18L3 10C0 7 0 3 3 1.5C6 0 9 2 12 5C15 2 18 0 21 1.5C24 3 24 7 21 10Z" fill="#f472b6" stroke="#ec4899" stroke-width="1"/></svg>` },
      { svg: s=>`<svg width="${s}" height="${s}" viewBox="0 0 20 20"><path d="M10 0L12 8L20 10L12 12L10 20L8 12L0 10L8 8Z" fill="white" opacity="0.9"/></svg>` },
    ];
    const box = document.getElementById('cg-companions');
    let cnt = 0;
    function spawn() {
      if (cnt >= 10) return;
      const t = types[Math.floor(Math.random()*types.length)];
      const el = document.createElement('div');
      el.className = 'cg-companion';
      const y = 8+Math.random()*42, dur = 5+Math.random()*5, sc = 0.7+Math.random()*0.6;
      const sz = [20,32,36,24,18][types.indexOf(t)] * sc;
      el.style.cssText = 'top:'+y+'%;--dur:'+dur+'s;transform:scale('+sc+');';
      el.innerHTML = t.svg(sz);
      box.appendChild(el);
      cnt++;
      setTimeout(()=>{ el.remove(); cnt--; }, dur*1000);
    }
    setInterval(spawn, 2200);
    setTimeout(spawn, 400);
    setTimeout(spawn, 900);

    /* 增强版梦幻粒子系统 */
    const particlesContainer = document.getElementById('magicalParticles');
    const heartColors = ['#f8c4d0', '#fcd5dd', '#fde0e5', '#f9b8c8', '#fce4ec', '#f5d0da'];
    const starColors = ['#ffffff', '#f0f7ff', '#e8f2ff', '#fff', '#dceeff', '#f5f0ff'];
    const petalColors = ['#fde4ea', '#fce8ef', '#fdf0f4', '#fff0f3'];

    let activeParticles = {
      hearts: 0,
      stars: 0,
      bubbles: 0,
      petals: 0,
      glows: 0,
      cloudpuffs: 0,
      specks: 0
    };

    const maxParticles = {
      hearts: 5,
      stars: 18,
      bubbles: 8,
      petals: 3,
      glows: 4,
      cloudpuffs: 6,
      specks: 15
    };

    function createHeart() {
      if (activeParticles.hearts >= maxParticles.hearts) return;
      
      const heart = document.createElement('div');
      heart.className = 'magic-heart';
      
      const size = 12 + Math.random() * 18;
      const left = 5 + Math.random() * 90;
      const duration = 12 + Math.random() * 10;
      const delay = Math.random() * 8;
      const color = heartColors[Math.floor(Math.random() * heartColors.length)];
      
      heart.style.cssText = `
        left: ${left}%;
        width: ${size}px;
        height: ${size}px;
        animation-duration: ${duration}s;
        animation-delay: ${delay}s;
        color: ${color};
      `;
      
      heart.innerHTML = `<svg viewBox="0 0 24 24" width="100%" height="100%">
        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="${color}"/>
      </svg>`;
      
      particlesContainer.appendChild(heart);
      activeParticles.hearts++;
      
      setTimeout(() => {
        if (heart.parentNode) {
          heart.remove();
          activeParticles.hearts--;
        }
      }, (duration + delay) * 1000);
    }

    function createStar() {
      if (activeParticles.stars >= maxParticles.stars) return;

      const star = document.createElement('div');
      star.className = 'magic-star';

      const size = 6 + Math.random() * 14;
      const left = Math.random() * 100;
      // Spread stars across the full page: some near bottom, some in middle, some up high
      const zone = Math.random();
      let bottom;
      if (zone < 0.35) {
        bottom = -30 + Math.random() * 40; // bottom area
      } else if (zone < 0.7) {
        bottom = 40 + Math.random() * 50; // middle
      } else {
        bottom = 60 + Math.random() * 35; // upper area
      }
      const duration = 4 + Math.random() * 5;
      const delay = Math.random() * 8;
      const color = starColors[Math.floor(Math.random() * starColors.length)];

      star.style.cssText = `
        left: ${left}%;
        bottom: ${bottom}%;
        width: ${size}px;
        height: ${size}px;
        animation-duration: ${duration}s, ${3 + Math.random() * 3}s;
        animation-delay: ${delay}s, ${delay}s;
      `;

      star.innerHTML = `<svg viewBox="0 0 24 24" width="100%" height="100%">
        <path d="M12 2L14 9L22 12L14 15L12 22L10 15L2 12L10 9Z" fill="${color}"/>
      </svg>`;

      particlesContainer.appendChild(star);
      activeParticles.stars++;

      setTimeout(() => {
        if (star.parentNode) {
          star.remove();
          activeParticles.stars--;
        }
      }, (duration + delay) * 1000);
    }

    function createBubble() {
      if (activeParticles.bubbles >= maxParticles.bubbles) return;

      const bubble = document.createElement('div');
      bubble.className = 'magic-bubble';

      const size = 18 + Math.random() * 35;
      const left = Math.random() * 100;
      // Spread bubbles from various vertical positions
      const zone = Math.random();
      let bottomVal;

        for (var i = 0; i < all.length; i++) {
          var el = all[i];
          if (removed.indexOf(el) !== -1) continue;
          // 跳过我们的关键元素
          if (el.id === 'root' || !el.parentNode) continue;
          if (el.closest && (el.closest('#magicalParticles') ||

          var style = window.getComputedStyle(el);
          var bg = style.backgroundColor;
          var pos = style.position;

          // 检测绿色背景（GSAP ScrollTrigger 标记 - 覆盖各种绿色值）
          if (bg && bg !== 'rgba(0, 0, 0, 0)' && bg !== 'transparent') {
            var m = bg.match(/rgb[a]?\((\d+),\s*(\d+),\s*(\d+)/);
            if (m) {
              var r = parseInt(m[1]), g = parseInt(m[2]), b = parseInt(m[3]);
              // 绿色分量明显高于红蓝
              if (g > 100 && g > r * 2 && g > b * 1.5) {
                removed.push(el); el.remove(); continue;
              }
            }
          }

          // 检测角标浮动元素
          if (pos === 'fixed' || pos === 'absolute') {
            var bottom = parseFloat(style.bottom);
            var right = parseFloat(style.right);
            var left = parseFloat(style.left);
            if (!isNaN(bottom) && bottom < 150 && !isNaN(right) && right < 150) {
              removed.push(el); el.remove(); continue;
            }
            if (!isNaN(bottom) && bottom < 150 && !isNaN(left) && left < 150) {
              removed.push(el); el.remove(); continue;
            }
          }
        }
      }
      setTimeout(sweep, 500);
      setTimeout(sweep, 1500);
      setTimeout(sweep, 3000);
      setTimeout(sweep, 5000);
      setTimeout(sweep, 8000);
      setTimeout(sweep, 12000);
      // 持续观察DOM变化
      var obs = new MutationObserver(function() { setTimeout(sweep, 200); });
      obs.observe(document.body, { childList: true, subtree: true });
      setTimeout(function() { obs.disconnect(); }, 20000);
    })();

          return (btn.textContent || '').trim() === '联系我';
        });
        if (contactButton && !document.body.dataset.contactClicked) {
          document.body.dataset.contactClicked = 'true';
          contactButton.click();
        }

        document.querySelectorAll('header, footer').forEach(function(el) {
          el.style.display = 'none';
        });

        var introHeading = Array.from(document.querySelectorAll('h1, h2, h3')).find(function(el) {
          return (el.textContent || '').trim() === '一起做点轻盈又有趣的东西吧。';
        });
        var introCard = introHeading && introHeading.closest('div');
        var contactGrid = introCard && introCard.parentElement;
        if (introCard) introCard.style.display = 'none';
        if (contactGrid) {
          contactGrid.style.gridTemplateColumns = '1fr';
          contactGrid.style.gap = '0';
          contactGrid.style.display = 'block';
          contactGrid.style.background = '#dff2ff';
          contactGrid.style.padding = '10px 0 0';
          contactGrid.style.borderRadius = '0';
          contactGrid.style.overflow = 'visible';
        }

        var toolCard = contactGrid && Array.from(contactGrid.children).find(function(el) {
          return el !== introCard && (el.textContent || '').indexOf('小康算命铺') >= 0;
        });
        if (toolCard) {
          toolCard.style.background = 'transparent';
          toolCard.style.border = '0';
          toolCard.style.boxShadow = 'none';
          toolCard.style.borderRadius = '0';
          toolCard.style.padding = '0';
        }

        var shell = document.querySelector('#root > div > div');
        if (shell) {
          shell.style.paddingTop = '0';
          shell.style.paddingLeft = '0';
          shell.style.paddingRight = '0';
          shell.style.paddingBottom = '0';
          shell.style.maxWidth = 'none';
        }

        sendHeight();
      }

      setInterval(activateContact, 400);
      window.addEventListener('load', activateContact);
      window.addEventListener('resize', sendHeight);
      new MutationObserver(activateContact).observe(document.documentElement, { childList: true, subtree: true });
    })();

    window.addEventListener('message', function(e) {
      if (!e.data || e.data.type !== 'contactEmbedHeight') return;
      var frame = document.getElementById('contact-original-frame');
      if (frame) frame.style.height = Math.max(900, e.data.height) + 'px';
    });
  </script>
