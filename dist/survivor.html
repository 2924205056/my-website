<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>云境守望者：无尽幸存</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; touch-action: none; user-select: none; background: #0a0e1a; }
    canvas { display: block; }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  
  <!-- HUD -->
  <div id="hud" style="position:fixed;top:16px;left:16px;z-index:10;">
    <div style="background:rgba(255,255,255,0.08);backdrop-filter:blur(16px);padding:12px 18px;border-radius:14px;border:1px solid rgba(255,255,255,0.12);color:white;">
      <div style="font-size:10px;font-weight:600;opacity:0.5;letter-spacing:0.1em;">等级</div>
      <div id="levelDisplay" style="font-size:32px;font-weight:800;line-height:1;">1</div>
    </div>
  </div>
  
  <div id="timeHud" style="position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:10;">
    <div style="background:rgba(255,255,255,0.08);backdrop-filter:blur(16px);padding:8px 20px;border-radius:14px;border:1px solid rgba(255,255,255,0.12);color:white;text-align:center;">
      <div id="timeDisplay" style="font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;">0:00</div>
    </div>
  </div>
  
  <div id="xpHud" style="position:fixed;top:16px;right:16px;z-index:10;">
    <div style="background:rgba(255,255,255,0.08);backdrop-filter:blur(16px);padding:12px 18px;border-radius:14px;border:1px solid rgba(255,255,255,0.12);color:white;min-width:120px;">
      <div style="font-size:10px;font-weight:600;opacity:0.5;letter-spacing:0.1em;">经验</div>
      <div style="background:rgba(255,255,255,0.1);height:6px;border-radius:3px;margin-top:6px;overflow:hidden;">
        <div id="xpBar" style="height:100%;background:linear-gradient(90deg,#3b82f6,#8b5cf6);width:0%;transition:width 0.3s;"></div>
      </div>
      <div id="xpText" style="font-size:11px;opacity:0.6;margin-top:4px;text-align:right;">0 / 10</div>
    </div>
  </div>
  
  <!-- HP Bar -->
  <div id="hpHud" style="position:fixed;bottom:60px;left:50%;transform:translateX(-50%);z-index:10;width:200px;">
    <div style="background:rgba(255,255,255,0.08);backdrop-filter:blur(16px);padding:10px 16px;border-radius:14px;border:1px solid rgba(255,255,255,0.12);">
      <div style="background:rgba(255,255,255,0.1);height:8px;border-radius:4px;overflow:hidden;">
        <div id="hpBar" style="height:100%;background:linear-gradient(90deg,#ef4444,#f97316);width:100%;transition:width 0.2s;"></div>
      </div>
      <div id="hpText" style="font-size:11px;color:white;opacity:0.7;text-align:center;margin-top:4px;">100 / 100</div>
    </div>
  </div>
  
  <!-- Instructions -->
  <div style="position:fixed;bottom:16px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.3);font-size:11px;text-align:center;z-index:10;">
    鼠标/手指控制移动，自动攻击
  </div>
  
  <!-- Level Up Screen -->
  <div id="levelUpScreen" style="display:none;position:fixed;inset:0;background:rgba(10,14,26,0.8);backdrop-filter:blur(20px);z-index:100;flex-direction:column;align-items:center;justify-content:center;">
    <div style="text-align:center;color:white;max-width:380px;padding:0 20px;">
      <div style="font-size:48px;margin-bottom:12px;">⚡</div>
      <h2 style="font-size:32px;font-weight:900;margin-bottom:4px;">升级!</h2>
      <p style="font-size:14px;opacity:0.5;margin-bottom:32px;">选择一项进化</p>
      
      <div id="skillOptions" style="display:flex;flex-direction:column;gap:12px;"></div>
    </div>
  </div>
  
  <!-- Game Over -->
  <div id="gameOverScreen" style="display:none;position:fixed;inset:0;background:rgba(10,14,26,0.85);backdrop-filter:blur(24px);z-index:100;flex-direction:column;align-items:center;justify-content:center;">
    <div style="background:linear-gradient(145deg,rgba(255,255,255,0.1),rgba(255,255,255,0.03));backdrop-filter:blur(40px);border:1px solid rgba(255,255,255,0.15);border-radius:32px;padding:48px 56px;text-align:center;color:white;max-width:360px;width:90%;">
      <div style="font-size:64px;margin-bottom:16px;">💀</div>
      <h2 style="font-size:28px;font-weight:900;margin-bottom:4px;">防线崩溃</h2>
      <div style="font-size:56px;font-weight:900;background:linear-gradient(135deg,#fbbf24,#f59e0b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:16px 0 4px;" id="finalLevel">1</div>
      <div style="font-size:11px;opacity:0.4;letter-spacing:0.15em;text-transform:uppercase;margin-bottom:32px;">最终等级</div>
      <button onclick="resetGame()" style="width:100%;padding:14px;border:none;border-radius:14px;background:linear-gradient(135deg,#7c3aed,#3b82f6);color:white;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 8px 24px rgba(124,58,237,0.3);">
        再次挑战 ↻
      </button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    let W, H;
    
    // Player
    let player = {
      x: 0, y: 0,
      targetX: 0, targetY: 0,
      hp: 100, maxHp: 100,
      level: 1,
      xp: 0,
      xpToNext: 10,
      radius: 20,
      // Stats
      attackRange: 120,
      attackDamage: 10,
      attackCooldown: 1000,
      maxTargets: 1,
      hasStormEye: false,
      stormEyeRadius: 0,
      stormEyeDamage: 0,
      hpRegen: 0
    };
    
    let enemies = [];
    let orbs = [];
    let lightnings = [];
    let stormEyeParticles = [];
    let effects = [];
    
    let gameTime = 0;
    let lastAttackTime = 0;
    let lastSpawnTime = 0;
    let gameRunning = false;
    let gameOver = false;
    
    // Mouse/Touch position
    let mouseX = 0, mouseY = 0;
    
    function resize() {
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = W;
      canvas.height = H;
    }
    resize();
    window.addEventListener('resize', resize);
    
    // Input
    canvas.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });
    canvas.addEventListener('touchmove', e => { e.preventDefault(); mouseX = e.touches[0].clientX; mouseY = e.touches[0].clientY; }, { passive: false });
    canvas.addEventListener('touchstart', e => { e.preventDefault(); mouseX = e.touches[0].clientX; mouseY = e.touches[0].clientY; });
    
    function initGame() {
      player.x = W / 2;
      player.y = H / 2;
      player.targetX = W / 2;
      player.targetY = H / 2;
      mouseX = W / 2;
      mouseY = H / 2;
      player.hp = 100;
      player.maxHp = 100;
      player.level = 1;
      player.xp = 0;
      player.xpToNext = 10;
      player.attackRange = 120;
      player.attackDamage = 10;
      player.attackCooldown = 1000;
      player.maxTargets = 1;
      player.hasStormEye = false;
      player.stormEyeRadius = 0;
      player.stormEyeDamage = 0;
      player.hpRegen = 0;
      enemies = [];
      orbs = [];
      lightnings = [];
      stormEyeParticles = [];
      effects = [];
      gameTime = 0;
      lastAttackTime = 0;
      lastSpawnTime = 0;
      gameRunning = true;
      gameOver = false;
      
      document.getElementById('gameOverScreen').style.display = 'none';
      document.getElementById('levelUpScreen').style.display = 'none';
      updateHUD();
    }
    
    function resetGame() {
      initGame();
    }
    
    // Skill definitions
    const SKILLS = [
      { id: 'lightning', name: '连环雷电', desc: '同时攻击 +1 个敌人', icon: '⚡', apply: () => { player.maxTargets++; } },
      { id: 'storm', name: '风暴之眼', desc: '身边生成持续伤害气流', icon: '🌀', apply: () => { player.hasStormEye = true; player.stormEyeRadius = 80; player.stormEyeDamage = 5; } },
      { id: 'regen', name: '云海吐纳', desc: '每秒回复 +2 HP', icon: '💚', apply: () => { player.hpRegen += 2; } },
      { id: 'range', name: '射程扩展', desc: '攻击范围 +30', icon: '🎯', apply: () => { player.attackRange += 30; } },
      { id: 'damage', name: '雷电强化', desc: '伤害 +5', icon: '🔥', apply: () => { player.attackDamage += 5; } },
      { id: 'speed', name: '充能加速', desc: '攻击间隔 -15%', icon: '⏱️', apply: () => { player.attackCooldown *= 0.85; } },
      { id: 'hp', name: '云体扩容', desc: '最大HP +30', icon: '❤️', apply: () => { player.maxHp += 30; player.hp += 30; } }
    ];
    
    function showLevelUp() {
      gameRunning = false;
      const screen = document.getElementById('levelUpScreen');
      screen.style.display = 'flex';
      
      // Pick 3 random skills
      const options = [];
      const available = [...SKILLS];
      for (let i = 0; i < Math.min(3, available.length); i++) {
        const idx = Math.floor(Math.random() * available.length);
        options.push(available.splice(idx, 1)[0]);
      }
      
      const container = document.getElementById('skillOptions');
      container.innerHTML = '';
      
      options.forEach(skill => {
        const btn = document.createElement('button');
        btn.style.cssText = 'background:rgba(255,255,255,0.08);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.15);border-radius:16px;padding:16px 20px;color:white;cursor:pointer;text-align:left;transition:all 0.2s;display:flex;align-items:center;gap:14px;';
        btn.innerHTML = `
          <div style="font-size:32px;flex-shrink:0;">${skill.icon}</div>
          <div>
            <div style="font-size:16px;font-weight:700;">${skill.name}</div>
            <div style="font-size:12px;opacity:0.5;margin-top:2px;">${skill.desc}</div>
          </div>
        `;
        btn.onmouseenter = () => { btn.style.background = 'rgba(255,255,255,0.15)'; btn.style.transform = 'scale(1.02)'; };
        btn.onmouseleave = () => { btn.style.background = 'rgba(255,255,255,0.08)'; btn.style.transform = 'scale(1)'; };
        btn.onclick = () => {
          skill.apply();
          screen.style.display = 'none';
          gameRunning = true;
        };
        container.appendChild(btn);
      });
    }
    
    function updateHUD() {
      document.getElementById('levelDisplay').textContent = player.level;
      document.getElementById('xpBar').style.width = (player.xp / player.xpToNext * 100) + '%';
      document.getElementById('xpText').textContent = player.xp + ' / ' + player.xpToNext;
      document.getElementById('hpBar').style.width = (player.hp / player.maxHp * 100) + '%';
      document.getElementById('hpText').textContent = Math.ceil(player.hp) + ' / ' + player.maxHp;
      
      const secs = Math.floor(gameTime / 1000);
      const mins = Math.floor(secs / 60);
      const s = secs % 60;
      document.getElementById('timeDisplay').textContent = mins + ':' + (s < 10 ? '0' : '') + s;
    }
    
    function addXp(amount) {
      player.xp += amount;
      while (player.xp >= player.xpToNext) {
        player.xp -= player.xpToNext;
        player.level++;
        player.xpToNext = Math.floor(player.xpToNext * 1.5);
        showLevelUp();
      }
      updateHUD();
    }
    
    // Spawn enemies
    function spawnEnemy() {
      const side = Math.floor(Math.random() * 4);
      let x, y;
      const margin = 50;
      switch(side) {
        case 0: x = -margin; y = Math.random() * H; break;
        case 1: x = W + margin; y = Math.random() * H; break;
        case 2: x = Math.random() * W; y = -margin; break;
        case 3: x = Math.random() * W; y = H + margin; break;
      }
      
      const difficulty = 1 + gameTime / 60000; // Get harder over time
      const baseHp = 20 + Math.floor(difficulty * 10);
      const baseSpeed = 0.8 + difficulty * 0.1;
      
      enemies.push({
        x, y,
        hp: baseHp,
        maxHp: baseHp,
        speed: Math.min(baseSpeed, 3),
        radius: 18 + Math.random() * 12,
        damage: 5 + Math.floor(difficulty * 2),
        attackCooldown: 0
      });
    }
    
    // Attack logic
    function performAttack() {
      const now = Date.now();
      if (now - lastAttackTime < player.attackCooldown) return;
      
      // Find enemies in range
      const inRange = enemies.filter(e => {
        const dx = e.x - player.x;
        const dy = e.y - player.y;
        return Math.sqrt(dx*dx + dy*dy) < player.attackRange + e.radius;
      }).sort((a, b) => {
        const da = (a.x-player.x)**2 + (a.y-player.y)**2;
        const db = (b.x-player.x)**2 + (b.y-player.y)**2;
        return da - db;
      });
      
      const targets = inRange.slice(0, player.maxTargets);
      
      targets.forEach(target => {
        target.hp -= player.attackDamage;
        // Lightning effect
        lightnings.push({
          x1: player.x, y1: player.y,
          x2: target.x, y2: target.y,
          life: 1,
          branches: generateLightningBranches(player.x, player.y, target.x, target.y)
        });
        
        // Hit effect
        effects.push({ x: target.x, y: target.y, type: 'hit', life: 1 });
      });
      
      if (targets.length > 0) {
        lastAttackTime = now;
      }
    }
    
    function generateLightningBranches(x1, y1, x2, y2) {
      const branches = [];
      const segments = 5;
      for (let i = 0; i < segments - 1; i++) {
        const t = (i + 1) / segments;
        const mx = x1 + (x2 - x1) * t;
        const my = y1 + (y2 - y1) * t;
        branches.push({
          x: mx + (Math.random() - 0.5) * 30,
          y: my + (Math.random() - 0.5) * 30
        });
      }
      return branches;
    }
    
    // Storm eye
    function updateStormEye() {
      if (!player.hasStormEye) return;
      
      stormEyeParticles = stormEyeParticles.filter(p => p.life > 0);
      
      if (stormEyeParticles.length < 20) {
        const angle = Math.random() * Math.PI * 2;
        stormEyeParticles.push({
          x: player.x + Math.cos(angle) * player.stormEyeRadius,
          y: player.y + Math.sin(angle) * player.stormEyeRadius,
          angle: angle,
          radius: player.stormEyeRadius,
          speed: 0.03,
          life: 1,
          size: 2 + Math.random() * 3
        });
      }
      
      stormEyeParticles.forEach(p => {
        p.angle += p.speed;
        p.x = player.x + Math.cos(p.angle) * p.radius;
        p.y = player.y + Math.sin(p.angle) * p.radius;
        
        // Damage enemies in storm
        enemies.forEach(e => {
          const dx = e.x - p.x;
          const dy = e.y - p.y;
          if (Math.sqrt(dx*dx + dy*dy) < e.radius + p.size) {
            if (!e.stormHit) {
              e.hp -= player.stormEyeDamage * 0.02;
              e.stormHit = true;
            }
          } else {
            e.stormHit = false;
          }
        });
      });
    }
    
    // HP regen
    let lastRegenTime = 0;
    function updateRegen() {
      if (player.hpRegen <= 0) return;
      const now = Date.now();
      if (now - lastRegenTime > 1000) {
        player.hp = Math.min(player.maxHp, player.hp + player.hpRegen);
        lastRegenTime = now;
        updateHUD();
      }
    }
    
    function update() {
      if (!gameRunning || gameOver) return;
      
      gameTime += 16;
      
      // Lerp player to mouse position
      const lerpFactor = 0.08;
      player.x += (mouseX - player.x) * lerpFactor;
      player.y += (mouseY - player.y) * lerpFactor;
      
      // Clamp to screen
      player.x = Math.max(player.radius, Math.min(W - player.radius, player.x));
      player.y = Math.max(player.radius, Math.min(H - player.radius, player.y));
      
      // Spawn enemies
      const spawnRate = Math.max(500, 2000 - gameTime / 100);
      if (Date.now() - lastSpawnTime > spawnRate) {
        spawnEnemy();
        lastSpawnTime = Date.now();
      }
      
      // Attack
      performAttack();
      updateStormEye();
      updateRegen();
      
      // Update enemies
      enemies = enemies.filter(e => {
        if (e.hp <= 0) {
          // Drop orb
          orbs.push({
            x: e.x, y: e.y,
            radius: 8,
            life: 1,
            xp: 2 + Math.floor(gameTime / 30000)
          });
          return false;
        }
        
        // Move toward player
        const dx = player.x - e.x;
        const dy = player.y - e.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        
        if (dist > 0) {
          e.x += (dx / dist) * e.speed;
          e.y += (dy / dist) * e.speed;
        }
        
        // Damage player on contact
        if (dist < player.radius + e.radius) {
          if (!e.attackCooldown || e.attackCooldown <= 0) {
            player.hp -= e.damage;
            e.attackCooldown = 500;
            effects.push({ x: player.x, y: player.y, type: 'damage', life: 1 });
            updateHUD();
            
            if (player.hp <= 0) {
              gameOver = true;
              document.getElementById('finalLevel').textContent = player.level;
              document.getElementById('gameOverScreen').style.display = 'flex';
            }
          }
        }
        
        if (e.attackCooldown > 0) e.attackCooldown -= 16;
        
        return true;
      });
      
      // Update orbs
      orbs = orbs.filter(o => {
        // Check if player is near
        const dx = player.x - o.x;
        const dy = player.y - o.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        
        // Magnet effect
        if (dist < 100) {
          const magnet = 0.1;
          o.x += (dx / dist) * dist * magnet * 0.1;
          o.y += (dy / dist) * dist * magnet * 0.1;
        }
        
        if (dist < player.radius + o.radius) {
          addXp(o.xp);
          return false;
        }
        
        return true;
      });
      
      // Update lightnings
      lightnings = lightnings.filter(l => {
        l.life -= 0.08;
        return l.life > 0;
      });
      
      // Update effects
      effects = effects.filter(e => {
        e.life -= 0.05;
        return e.life > 0;
      });
    }
    
    function draw() {
      // Background
      const bgGrad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, W * 0.7);
      bgGrad.addColorStop(0, '#1e293b');
      bgGrad.addColorStop(0.5, '#0f172a');
      bgGrad.addColorStop(1, '#0a0e1a');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, W, H);
      
      // Stars
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      for (let i = 0; i < 80; i++) {
        const x = (i * 47) % W;
        const y = (i * 73) % H;
        ctx.beginPath();
        ctx.arc(x, y, 0.8, 0, Math.PI * 2);
        ctx.fill();
      }
      
      // Attack range circle (subtle)
      ctx.strokeStyle = 'rgba(59, 130, 246, 0.15)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.attackRange, 0, Math.PI * 2);
      ctx.stroke();
      
      // Storm eye
      if (player.hasStormEye) {
        ctx.strokeStyle = 'rgba(139, 92, 246, 0.3)';
        ctx.lineWidth = 2;
        ctx.setLineDash([4, 8]);
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.stormEyeRadius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
        
        // Storm particles
        stormEyeParticles.forEach(p => {
          ctx.globalAlpha = p.life * 0.6;
          ctx.fillStyle = '#8b5cf6';
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.globalAlpha = 1;
      }
      
      // Orbs
      orbs.forEach(o => {
        ctx.shadowColor = '#3b82f6';
        ctx.shadowBlur = 12;
        ctx.fillStyle = '#3b82f6';
        ctx.beginPath();
        ctx.arc(o.x, o.y, o.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.beginPath();
        ctx.arc(o.x - 2, o.y - 2, 2, 0, Math.PI * 2);
        ctx.fill();
      });
      
      // Enemies
      enemies.forEach(e => {
        // Glow
        ctx.shadowColor = 'rgba(239, 68, 68, 0.4)';
        ctx.shadowBlur = 15;
        
        // Body
        const enemyGrad = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, e.radius);
        enemyGrad.addColorStop(0, 'rgba(100, 116, 139, 0.9)');
        enemyGrad.addColorStop(0.7, 'rgba(51, 65, 85, 0.8)');
        enemyGrad.addColorStop(1, 'rgba(30, 41, 59, 0.6)');
        ctx.fillStyle = enemyGrad;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        
        // Border
        ctx.strokeStyle = 'rgba(239, 68, 68, 0.4)';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        
        // HP bar
        const hpW = e.radius * 2;
        const hpH = 3;
        const hpX = e.x - hpW/2;
        const hpY = e.y - e.radius - 8;
        ctx.fillStyle = 'rgba(255,255,255,0.1)';
        ctx.fillRect(hpX, hpY, hpW, hpH);
        ctx.fillStyle = e.hp > e.maxHp * 0.3 ? '#3b82f6' : '#ef4444';
        ctx.fillRect(hpX, hpY, hpW * (e.hp / e.maxHp), hpH);
      });
      
      // Player
      ctx.shadowColor = '#3b82f6';
      ctx.shadowBlur = 25;
      const playerGrad = ctx.createRadialGradient(player.x, player.y, 0, player.x, player.y, player.radius);
      playerGrad.addColorStop(0, 'rgba(147, 197, 253, 0.9)');
      playerGrad.addColorStop(0.5, 'rgba(59, 130, 246, 0.7)');
      playerGrad.addColorStop(1, 'rgba(37, 99, 235, 0.5)');
      ctx.fillStyle = playerGrad;
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      
      // Player emoji
      ctx.font = `${player.radius * 1.2}px Arial`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('☁️', player.x, player.y);
      
      // Lightnings
      lightnings.forEach(l => {
        ctx.globalAlpha = l.life;
        ctx.strokeStyle = '#93c5fd';
        ctx.lineWidth = 3;
        ctx.shadowColor = '#60a5fa';
        ctx.shadowBlur = 20;
        
        // Main bolt
        ctx.beginPath();
        ctx.moveTo(l.x1, l.y1);
        l.branches.forEach(b => ctx.lineTo(b.x, b.y));
        ctx.lineTo(l.x2, l.y2);
        ctx.stroke();
        
        // White core
        ctx.strokeStyle = 'rgba(255,255,255,0.8)';
        ctx.lineWidth = 1;
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.moveTo(l.x1, l.y1);
        l.branches.forEach(b => ctx.lineTo(b.x, b.y));
        ctx.lineTo(l.x2, l.y2);
        ctx.stroke();
        
        ctx.shadowBlur = 0;
        ctx.globalAlpha = 1;
      });
      
      // Effects
      effects.forEach(e => {
        ctx.globalAlpha = e.life;
        if (e.type === 'hit') {
          ctx.fillStyle = '#fbbf24';
          ctx.beginPath();
          ctx.arc(e.x, e.y, 8 * e.life, 0, Math.PI * 2);
          ctx.fill();
        } else if (e.type === 'damage') {
          ctx.fillStyle = '#ef4444';
          ctx.beginPath();
          ctx.arc(e.x, e.y, 12 * e.life, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      });
      
      update();
      requestAnimationFrame(draw);
    }
    
    initGame();
    draw();
  </script>
</body>
</html>
