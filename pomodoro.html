<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>番茄钟 · 云端专注</title>
<style>
:root {
  --sky-light: #edf8ff;
  --sky-mid: #dff2ff;
  --sky-blue: #9fd0ff;
  --sky-deep: #7ab8f5;
  --pink: #2f7fd0;
  --pink-light: #7fb3dd;
  --white: #ffffff;
  --card-bg: rgba(244,247,238,0.94);
  --card-shadow: 0 8px 32px rgba(159, 208, 255, 0.25), 0 2px 8px rgba(159, 208, 255, 0.15);
  --card-shadow-hover: 0 12px 40px rgba(159, 208, 255, 0.35), 0 4px 12px rgba(159, 208, 255, 0.2);
  --text-primary: #0e3a7d;
  --text-secondary: #4a6b9d;
  --text-muted: #7d97bd;
  --ring-bg: rgba(159, 208, 255, 0.2);
  --ring-focus: #9fd0ff;
  --ring-short: #b9cf8e;
  --ring-long: #2f7fd0;
  --btn-focus: linear-gradient(135deg, #9fd0ff 0%, #7ab8f5 100%);
  --btn-short: linear-gradient(135deg, #b9cf8e 0%, #4ade80 100%);
  --btn-long: linear-gradient(135deg, #7fb3dd 0%, #2f7fd0 100%);
  --radius: 28px;
  --radius-sm: 16px;
  --radius-pill: 50px;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: "Kaiti SC","STKaiti","Songti SC",serif;
  background: linear-gradient(170deg, #D6EEFF 0%, #E8F4FD 30%, #F0F7FF 60%, #F5F0FF 100%);
  background-attachment: fixed;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  color: var(--text-primary);
}

.clouds-container {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}

.cloud {
  position: absolute;
  background: rgba(255, 255, 255, 0.6);
  border-radius: 50%;
  filter: blur(1px);
}

.cloud::before,
.cloud::after {
  content: '';
  position: absolute;
  background: inherit;
  border-radius: 50%;
}

.cloud-1 {
  width: 120px;
  height: 50px;
  top: 8%;
  left: -150px;
  animation: float-cloud 28s linear infinite;
  opacity: 0.7;
}
.cloud-1::before { width: 60px; height: 60px; top: -30px; left: 20px; }
.cloud-1::after { width: 80px; height: 55px; top: -25px; left: 50px; }

.cloud-2 {
  width: 160px;
  height: 60px;
  top: 20%;
  left: -200px;
  animation: float-cloud 36s linear infinite 5s;
  opacity: 0.5;
}
.cloud-2::before { width: 80px; height: 70px; top: -35px; left: 25px; }
.cloud-2::after { width: 100px; height: 65px; top: -30px; left: 65px; }

.cloud-3 {
  width: 100px;
  height: 40px;
  top: 55%;
  left: -130px;
  animation: float-cloud 32s linear infinite 12s;
  opacity: 0.4;
}
.cloud-3::before { width: 50px; height: 50px; top: -25px; left: 15px; }
.cloud-3::after { width: 65px; height: 45px; top: -20px; left: 40px; }

.cloud-4 {
  width: 180px;
  height: 65px;
  top: 72%;
  left: -220px;
  animation: float-cloud 40s linear infinite 18s;
  opacity: 0.35;
}
.cloud-4::before { width: 90px; height: 75px; top: -38px; left: 30px; }
.cloud-4::after { width: 110px; height: 70px; top: -32px; left: 75px; }

.cloud-5 {
  width: 90px;
  height: 35px;
  top: 35%;
  left: -120px;
  animation: float-cloud 25s linear infinite 8s;
  opacity: 0.55;
}
.cloud-5::before { width: 45px; height: 45px; top: -22px; left: 12px; }
.cloud-5::after { width: 55px; height: 40px; top: -18px; left: 35px; }

.cloud-6 {
  width: 140px;
  height: 55px;
  top: 88%;
  left: -170px;
  animation: float-cloud 34s linear infinite 22s;
  opacity: 0.3;
}
.cloud-6::before { width: 70px; height: 65px; top: -32px; left: 22px; }
.cloud-6::after { width: 85px; height: 58px; top: -28px; left: 58px; }

@keyframes float-cloud {
  0% { transform: translateX(0); }
  100% { transform: translateX(calc(100vw + 300px)); }
}

.pomodoro-app {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 420px;
  padding: 20px;
}

.card {
  background: var(--card-bg);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-radius: var(--radius);
  box-shadow: var(--card-shadow);
  border: 1px solid rgba(255, 255, 255, 0.6);
  padding: 36px 32px;
  transition: box-shadow 0.3s ease;
}

.card:hover {
  box-shadow: var(--card-shadow-hover);
}

.app-title {
  text-align: center;
  font-size: 22px;
  font-weight: 800;
  color: var(--text-primary);
  margin-bottom: 28px;
  letter-spacing: 0.5px;
}

.app-title span {
  background: linear-gradient(135deg, var(--sky-blue), var(--pink));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.mode-switcher {
  display: flex;
  justify-content: center;
  gap: 6px;
  margin-bottom: 36px;
  background: rgba(159, 208, 255, 0.12);
  border-radius: var(--radius-pill);
  padding: 5px;
}

.mode-btn {
  font-family: "Kaiti SC","STKaiti","Songti SC",serif;
  font-size: 13px;
  font-weight: 700;
  padding: 9px 18px;
  border: none;
  border-radius: var(--radius-pill);
  cursor: pointer;
  transition: all 0.3s ease;
  color: var(--text-secondary);
  background: transparent;
  white-space: nowrap;
}

.mode-btn:hover {
  color: var(--text-primary);
  background: rgba(255, 255, 255, 0.5);
}

.mode-btn.active {
  color: var(--white);
  background: var(--btn-focus);
  box-shadow: 0 4px 14px rgba(159, 208, 255, 0.4);
}

.mode-btn.active[data-mode="shortBreak"] {
  background: var(--btn-short);
  box-shadow: 0 4px 14px rgba(134, 239, 172, 0.4);
}

.mode-btn.active[data-mode="longBreak"] {
  background: var(--btn-long);
  box-shadow: 0 4px 14px rgba(244, 114, 182, 0.4);
}

.timer-container {
  display: flex;
  justify-content: center;
  margin-bottom: 32px;
}

.timer-circle {
  position: relative;
  width: 240px;
  height: 240px;
}

.timer-svg {
  width: 100%;
  height: 100%;
  transform: rotate(-90deg);
}

.timer-ring-bg {
  fill: none;
  stroke: var(--ring-bg);
  stroke-width: 8;
}

.timer-ring-progress {
  fill: none;
  stroke: var(--ring-focus);
  stroke-width: 8;
  stroke-linecap: round;
  transition: stroke-dashoffset 0.5s ease, stroke 0.5s ease;
  filter: drop-shadow(0 0 6px rgba(159, 208, 255, 0.5));
}

.timer-ring-progress.short-break {
  stroke: var(--ring-short);
  filter: drop-shadow(0 0 6px rgba(134, 239, 172, 0.5));
}

.timer-ring-progress.long-break {
  stroke: var(--ring-long);
  filter: drop-shadow(0 0 6px rgba(244, 114, 182, 0.5));
}

.timer-text {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
}

.timer-time {
  font-size: 52px;
  font-weight: 900;
  color: var(--text-primary);
  line-height: 1;
  letter-spacing: -1px;
}

.timer-label {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-muted);
  margin-top: 6px;
  text-transform: uppercase;
  letter-spacing: 1.5px;
}

.controls {
  display: flex;
  justify-content: center;
  gap: 14px;
  margin-bottom: 28px;
}

.ctrl-btn {
  font-family: "Kaiti SC","STKaiti","Songti SC",serif;
  font-size: 15px;
  font-weight: 700;
  padding: 13px 32px;
  border: none;
  border-radius: var(--radius-pill);
  cursor: pointer;
  transition: all 0.3s ease;
  color: var(--white);
  position: relative;
  overflow: hidden;
}

.ctrl-btn::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(255, 255, 255, 0);
  transition: background 0.3s ease;
  border-radius: inherit;
}

.ctrl-btn:hover::before {
  background: rgba(255, 255, 255, 0.15);
}

.ctrl-btn:active {
  transform: scale(0.96);
}

.btn-start {
  background: var(--btn-focus);
  box-shadow: 0 4px 16px rgba(159, 208, 255, 0.45);
  min-width: 130px;
}

.btn-start.running {
  background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
  box-shadow: 0 4px 16px rgba(245, 158, 11, 0.4);
}

.btn-start.short-break-mode {
  background: var(--btn-short);
  box-shadow: 0 4px 16px rgba(134, 239, 172, 0.45);
}

.btn-start.short-break-mode.running {
  background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
  box-shadow: 0 4px 16px rgba(245, 158, 11, 0.4);
}

.btn-start.long-break-mode {
  background: var(--btn-long);
  box-shadow: 0 4px 16px rgba(244, 114, 182, 0.45);
}

.btn-start.long-break-mode.running {
  background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
  box-shadow: 0 4px 16px rgba(245, 158, 11, 0.4);
}

.btn-reset {
  background: rgba(159, 208, 255, 0.15);
  color: var(--text-secondary);
  box-shadow: none;
  padding: 13px 24px;
}

.btn-reset:hover {
  background: rgba(159, 208, 255, 0.25);
  color: var(--text-primary);
}

.session-info {
  text-align: center;
  padding-top: 20px;
  border-top: 1px solid rgba(159, 208, 255, 0.15);
}

.session-label {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-muted);
  margin-bottom: 8px;
  letter-spacing: 0.5px;
}

.session-dots {
  display: flex;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
}

.session-dot {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: rgba(159, 208, 255, 0.2);
  transition: all 0.4s ease;
  border: 2px solid rgba(159, 208, 255, 0.3);
}

.session-dot.completed {
  background: linear-gradient(135deg, var(--sky-blue), var(--pink));
  border-color: transparent;
  box-shadow: 0 2px 8px rgba(244, 114, 182, 0.35);
  animation: dot-pop 0.4s ease;
}

@keyframes dot-pop {
  0% { transform: scale(0.5); }
  50% { transform: scale(1.3); }
  100% { transform: scale(1); }
}

.session-count {
  font-size: 14px;
  font-weight: 700;
  color: var(--text-secondary);
  margin-top: 10px;
}

.session-count span {
  color: var(--pink);
  font-size: 18px;
}

.notification-flash {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(159, 208, 255, 0.15);
  z-index: 100;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.3s ease;
}

.notification-flash.show {
  opacity: 1;
  animation: flash-pulse 1.5s ease-out;
}

@keyframes flash-pulse {
  0% { opacity: 0.6; }
  50% { opacity: 0.2; }
  70% { opacity: 0.5; }
  100% { opacity: 0; }
}

@media (max-width: 480px) {
  .pomodoro-app {
    padding: 12px;
  }
  .card {
    padding: 28px 20px;
  }
  .timer-circle {
    width: 200px;
    height: 200px;
  }
  .timer-time {
    font-size: 42px;
  }
  .mode-btn {
    font-size: 12px;
    padding: 8px 14px;
  }
  .ctrl-btn {
    font-size: 14px;
    padding: 12px 24px;
  }
  .btn-start {
    min-width: 110px;
  }
}
</style>

<link href="./assets/tool-theme.css" rel="stylesheet">

</style>
</head>
<body class="deco-br">
<a class="back-home" href="./index.html">&#8249; 云朵实验室</a>

<div class="clouds-container">
  <div class="cloud cloud-1"></div>
  <div class="cloud cloud-2"></div>
  <div class="cloud cloud-3"></div>
  <div class="cloud cloud-4"></div>
  <div class="cloud cloud-5"></div>
  <div class="cloud cloud-6"></div>
</div>

<div class="notification-flash" id="notificationFlash"></div>

<div class="pomodoro-app">
  <div class="card">
    <div class="app-title">☁️ <span>云端专注</span> · 番茄钟</div>

    <div class="mode-switcher">
      <button class="mode-btn active" data-mode="focus" onclick="switchMode('focus')">专注</button>
      <button class="mode-btn" data-mode="shortBreak" onclick="switchMode('shortBreak')">短休息</button>
      <button class="mode-btn" data-mode="longBreak" onclick="switchMode('longBreak')">长休息</button>
    </div>

    <div class="timer-container">
      <div class="timer-circle">
        <svg class="timer-svg" viewBox="0 0 240 240">
          <circle class="timer-ring-bg" cx="120" cy="120" r="105"></circle>
          <circle class="timer-ring-progress" id="timerRing" cx="120" cy="120" r="105"></circle>
        </svg>
        <div class="timer-text">
          <div class="timer-time" id="timerTime">25:00</div>
          <div class="timer-label" id="timerLabel">专注时间</div>
        </div>
      </div>
    </div>

    <div class="controls">
      <button class="ctrl-btn btn-start" id="btnStart" onclick="toggleTimer()">开始</button>
      <button class="ctrl-btn btn-reset" id="btnReset" onclick="resetTimer()">重置</button>
    </div>

    <div class="session-info">
      <div class="session-label">已完成番茄数</div>
      <div class="session-dots" id="sessionDots"></div>
      <div class="session-count">共 <span id="sessionCount">0</span> 个番茄</div>
    </div>
  </div>
</div>

<script>
var MODES = {
  focus: { duration: 25 * 60, label: '专注时间' },
  shortBreak: { duration: 5 * 60, label: '短休息' },
  longBreak: { duration: 15 * 60, label: '长休息' }
};

var currentMode = 'focus';
var timeRemaining = MODES.focus.duration;
var totalTime = MODES.focus.duration;
var isRunning = false;
var timerInterval = null;
var completedSessions = 0;

var CIRCUMFERENCE = 2 * Math.PI * 105;

var timerRing = document.getElementById('timerRing');
var timerTime = document.getElementById('timerTime');
var timerLabel = document.getElementById('timerLabel');
var btnStart = document.getElementById('btnStart');
var sessionDots = document.getElementById('sessionDots');
var sessionCount = document.getElementById('sessionCount');
var notificationFlash = document.getElementById('notificationFlash');

timerRing.style.strokeDasharray = CIRCUMFERENCE;
timerRing.style.strokeDashoffset = '0';

function formatTime(seconds) {
  var m = Math.floor(seconds / 60);
  var s = seconds % 60;
  return (m < 10 ? '0' + m : m) + ':' + (s < 10 ? '0' + s : s);
}

function updateDisplay() {
  timerTime.textContent = formatTime(timeRemaining);

  var progress = 1 - (timeRemaining / totalTime);
  var offset = CIRCUMFERENCE * (1 - progress);
  timerRing.style.strokeDashoffset = offset;

  timerRing.classList.remove('short-break', 'long-break');
  if (currentMode === 'shortBreak') {
    timerRing.classList.add('short-break');
  } else if (currentMode === 'longBreak') {
    timerRing.classList.add('long-break');
  }
}

function updateButtonState() {
  btnStart.classList.remove('running', 'short-break-mode', 'long-break-mode');

  if (currentMode === 'shortBreak') {
    btnStart.classList.add('short-break-mode');
  } else if (currentMode === 'longBreak') {
    btnStart.classList.add('long-break-mode');
  }

  if (isRunning) {
    btnStart.classList.add('running');
    btnStart.textContent = '暂停';
  } else {
    btnStart.textContent = timeRemaining < totalTime ? '继续' : '开始';
  }
}

function switchMode(mode) {
  if (isRunning) {
    clearInterval(timerInterval);
    isRunning = false;
  }

  currentMode = mode;
  totalTime = MODES[mode].duration;
  timeRemaining = totalTime;
  timerLabel.textContent = MODES[mode].label;

  var btns = document.querySelectorAll('.mode-btn');
  btns.forEach(function(b) {
    b.classList.remove('active');
    if (b.getAttribute('data-mode') === mode) {
      b.classList.add('active');
    }
  });

  updateDisplay();
  updateButtonState();
}

function toggleTimer() {
  if (isRunning) {
    clearInterval(timerInterval);
    isRunning = false;
  } else {
    isRunning = true;
    timerInterval = setInterval(function() {
      timeRemaining--;
      if (timeRemaining <= 0) {
        timeRemaining = 0;
        clearInterval(timerInterval);
        isRunning = false;
        onTimerComplete();
      }
      updateDisplay();
      updateButtonState();
    }, 1000);
  }
  updateButtonState();
}

function resetTimer() {
  clearInterval(timerInterval);
  isRunning = false;
  timeRemaining = MODES[currentMode].duration;
  totalTime = MODES[currentMode].duration;
  updateDisplay();
  updateButtonState();
}

function onTimerComplete() {
  playNotificationSound();
  showFlash();

  if (currentMode === 'focus') {
    completedSessions++;
    renderSessionDots();
    sessionCount.textContent = completedSessions;

    if (completedSessions % 4 === 0) {
      setTimeout(function() { switchMode('longBreak'); }, 800);
    } else {
      setTimeout(function() { switchMode('shortBreak'); }, 800);
    }
  } else {
    setTimeout(function() { switchMode('focus'); }, 800);
  }
}

function renderSessionDots() {
  sessionDots.innerHTML = '';
  var displayCount = Math.max(completedSessions, 4);
  for (var i = 0; i < displayCount; i++) {
    var dot = document.createElement('div');
    dot.className = 'session-dot' + (i < completedSessions ? ' completed' : '');
    sessionDots.appendChild(dot);
  }
}

function playNotificationSound() {
  try {
    var ctx = new (window.AudioContext || window.webkitAudioContext)();
    var notes = [523.25, 659.25, 783.99, 1046.50];
    notes.forEach(function(freq, i) {
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.15, ctx.currentTime + i * 0.18);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.18 + 0.4);
      osc.start(ctx.currentTime + i * 0.18);
      osc.stop(ctx.currentTime + i * 0.18 + 0.4);
    });
  } catch (e) {}
}

function showFlash() {
  notificationFlash.classList.add('show');
  setTimeout(function() {
    notificationFlash.classList.remove('show');
  }, 1500);
}

renderSessionDots();
updateDisplay();
</script>
