<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Code Generator - 云端二维码</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --sky-1:#D6EEFF;--sky-2:#E8F4FD;--sky-3:#F0F7FF;--sky-4:#F5F0FF;
  --card-bg:rgba(244,247,238,0.94);--card-shadow:0 8px 32px rgba(100,160,220,0.18);
  --accent:#2f7fd0;--accent-hover:#1657b8;--text:#0e3a7d;--text-light:#4a6b9d;
  --radius:28px;--radius-sm:14px;--radius-xs:10px;
}
html{scroll-behavior:smooth}
body{
  font-family:"Kaiti SC","STKaiti","Songti SC",serif;color:var(--text);
  background:linear-gradient(170deg,var(--sky-1) 0%,var(--sky-2) 30%,var(--sky-3) 60%,var(--sky-4) 100%);
  background-attachment:fixed;min-height:100vh;overflow-x:hidden;
  display:flex;flex-direction:column;align-items:center;padding:40px 20px 60px;
}

.cloud{
  position:fixed;border-radius:50%;pointer-events:none;z-index:0;
  background:rgba(255,255,255,0.55);filter:blur(1px);
}
.cloud::before,.cloud::after{
  content:'';position:absolute;background:inherit;border-radius:50%;
}
.cloud-1{width:200px;height:60px;top:8%;left:-5%;animation:floatCloud 35s linear infinite}
.cloud-1::before{width:100px;height:50px;top:-25px;left:30px}
.cloud-1::after{width:120px;height:55px;top:-20px;left:70px}

.cloud-2{width:260px;height:70px;top:18%;right:-8%;animation:floatCloud 45s linear infinite reverse;opacity:0.7}
.cloud-2::before{width:120px;height:60px;top:-30px;left:40px}
.cloud-2::after{width:140px;height:65px;top:-25px;left:90px}

.cloud-3{width:180px;height:50px;top:40%;left:5%;animation:floatCloud 50s linear infinite;opacity:0.5}
.cloud-3::before{width:90px;height:45px;top:-22px;left:25px}
.cloud-3::after{width:110px;height:48px;top:-18px;left:60px}

.cloud-4{width:220px;height:55px;top:60%;right:3%;animation:floatCloud 40s linear infinite reverse;opacity:0.6}
.cloud-4::before{width:110px;height:50px;top:-25px;left:35px}
.cloud-4::after{width:130px;height:52px;top:-22px;left:80px}

.cloud-5{width:160px;height:45px;top:78%;left:10%;animation:floatCloud 55s linear infinite;opacity:0.45}
.cloud-5::before{width:80px;height:40px;top:-20px;left:20px}
.cloud-5::after{width:100px;height:42px;top:-16px;left:55px}

.cloud-6{width:240px;height:65px;top:90%;right:10%;animation:floatCloud 38s linear infinite reverse;opacity:0.55}
.cloud-6::before{width:115px;height:55px;top:-28px;left:45px}
.cloud-6::after{width:135px;height:58px;top:-24px;left:85px}

@keyframes floatCloud{
  0%{transform:translateX(0)}
  100%{transform:translateX(calc(100vw + 300px))}
}

.page-title{
  position:relative;z-index:1;text-align:center;margin-bottom:36px;
}
.page-title h1{
  font-size:2.4rem;font-weight:800;
  background:linear-gradient(135deg,#3a6db5,#7b5ea7);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}
.page-title p{font-size:1rem;color:var(--text-light);margin-top:6px;font-weight:600}

.main-container{
  position:relative;z-index:1;width:100%;max-width:820px;
  display:flex;flex-direction:column;gap:24px;
}

.card{
  background:var(--card-bg);border-radius:var(--radius);
  box-shadow:var(--card-shadow);backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);padding:28px;
  border:1px solid rgba(255,255,255,0.6);
  transition:box-shadow 0.3s;
}
.card:hover{box-shadow:0 12px 40px rgba(100,160,220,0.25)}

.card-label{
  font-size:0.8rem;font-weight:700;text-transform:uppercase;
  letter-spacing:1.2px;color:var(--text-light);margin-bottom:14px;
}

.template-bar{
  display:flex;flex-wrap:wrap;gap:10px;
}
.template-btn{
  padding:8px 18px;border:none;border-radius:50px;cursor:pointer;
  font-family:"Kaiti SC","STKaiti","Songti SC",serif;font-size:0.85rem;font-weight:700;
  background:rgba(91,143,217,0.12);color:var(--accent);
  transition:all 0.25s;
}
.template-btn:hover{background:rgba(91,143,217,0.22)}
.template-btn.active{background:var(--accent);color:#fff;box-shadow:0 4px 14px rgba(91,143,217,0.35)}

.input-section{display:flex;flex-direction:column;gap:14px}
.text-input{
  width:100%;padding:14px 18px;border:2px solid rgba(91,143,217,0.2);
  border-radius:var(--radius-sm);font-family:"Kaiti SC","STKaiti","Songti SC",serif;
  font-size:1rem;color:var(--text);background:rgba(255,255,255,0.7);
  outline:none;transition:border-color 0.25s,box-shadow 0.25s;resize:vertical;min-height:56px;
}
.text-input:focus{
  border-color:var(--accent);box-shadow:0 0 0 4px rgba(91,143,217,0.12);
}
.text-input::placeholder{color:#a8b8d0}

.wifi-fields{
  display:none;gap:12px;flex-direction:column;
}
.wifi-fields.show{display:flex}
.wifi-row{display:flex;gap:12px;flex-wrap:wrap}
.wifi-row .text-input{flex:1;min-width:0}
.wifi-enc-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.wifi-enc-row span{font-weight:700;font-size:0.85rem;color:var(--text-light);white-space:nowrap}
.enc-btn{
  padding:6px 14px;border:none;border-radius:50px;cursor:pointer;
  font-family:"Kaiti SC","STKaiti","Songti SC",serif;font-size:0.8rem;font-weight:700;
  background:rgba(91,143,217,0.12);color:var(--accent);transition:all 0.25s;
}
.enc-btn:hover{background:rgba(91,143,217,0.22)}
.enc-btn.active{background:var(--accent);color:#fff}

.qr-display{
  display:flex;flex-direction:column;align-items:center;gap:24px;
}
.qr-canvas-wrap{
  position:relative;padding:24px;border-radius:20px;
  background:#fff;box-shadow:0 4px 20px rgba(100,160,220,0.12);
  display:flex;align-items:center;justify-content:center;
  min-width:160px;min-height:160px;
}
.qr-canvas-wrap #qrcode{line-height:0}
.qr-canvas-wrap #qrcode img{display:block}
.qr-canvas-wrap #qrcode canvas{display:none!important}
.qr-placeholder{
  color:#b0c4de;font-size:0.95rem;font-weight:600;text-align:center;
  padding:40px 20px;
}

.customize-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:16px;
}
@media(max-width:560px){.customize-grid{grid-template-columns:1fr}}
.customize-item{display:flex;flex-direction:column;gap:8px}
.customize-item label{font-size:0.82rem;font-weight:700;color:var(--text-light);text-transform:uppercase;letter-spacing:0.8px}

.color-pick-row{display:flex;align-items:center;gap:10px}
.color-pick-row input[type="color"]{
  width:40px;height:40px;border:2px solid rgba(91,143,217,0.2);
  border-radius:var(--radius-xs);cursor:pointer;padding:2px;
  background:rgba(255,255,255,0.7);
}
.color-pick-row input[type="color"]::-webkit-color-swatch-wrapper{padding:2px}
.color-pick-row input[type="color"]::-webkit-color-swatch{border-radius:6px;border:none}
.color-hex{
  font-size:0.85rem;font-weight:600;color:var(--text);font-family:"Kaiti SC","STKaiti","Songti SC",serif;
}

.size-select{
  padding:10px 14px;border:2px solid rgba(91,143,217,0.2);
  border-radius:var(--radius-xs);font-family:"Kaiti SC","STKaiti","Songti SC",serif;
  font-size:0.9rem;font-weight:600;color:var(--text);
  background:rgba(255,255,255,0.7);cursor:pointer;outline:none;
  transition:border-color 0.25s;
}
.size-select:focus{border-color:var(--accent)}

.ec-row{display:flex;gap:8px;flex-wrap:wrap}
.ec-btn{
  padding:8px 18px;border:none;border-radius:50px;cursor:pointer;
  font-family:"Kaiti SC","STKaiti","Songti SC",serif;font-size:0.85rem;font-weight:700;
  background:rgba(91,143,217,0.12);color:var(--accent);transition:all 0.25s;
}
.ec-btn:hover{background:rgba(91,143,217,0.22)}
.ec-btn.active{background:var(--accent);color:#fff;box-shadow:0 4px 14px rgba(91,143,217,0.35)}

.action-bar{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.action-btn{
  padding:12px 28px;border:none;border-radius:50px;cursor:pointer;
  font-family:"Kaiti SC","STKaiti","Songti SC",serif;font-size:0.95rem;font-weight:700;
  display:flex;align-items:center;gap:8px;transition:all 0.25s;
}
.btn-primary{
  background:linear-gradient(135deg,var(--accent),#7b5ea7);color:#fff;
  box-shadow:0 6px 20px rgba(91,143,217,0.35);
}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(91,143,217,0.45)}
.btn-secondary{
  background:rgba(91,143,217,0.12);color:var(--accent);
}
.btn-secondary:hover{background:rgba(91,143,217,0.22)}

.toast{
  position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(80px);
  background:rgba(44,62,107,0.92);color:#fff;padding:12px 28px;
  border-radius:50px;font-family:"Kaiti SC","STKaiti","Songti SC",serif;font-size:0.9rem;
  font-weight:700;z-index:999;opacity:0;transition:all 0.4s cubic-bezier(0.22,1,0.36,1);
  pointer-events:none;backdrop-filter:blur(8px);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:560px){
  body{padding:24px 14px 40px}
  .card{padding:20px}
  .page-title h1{font-size:1.8rem}
  .qr-canvas-wrap{padding:16px}
}
</style>
<link href="./assets/fonts/fonts.css" rel="stylesheet">
<link href="./assets/tool-theme.css" rel="stylesheet">
<style>
h1{font-family:"HanziPen SC","Hannotate SC","Kaiti SC",cursive !important;color:#f4f7ee !important;text-shadow:0 4px 18px rgba(8,38,90,.45);-webkit-text-fill-color:#f4f7ee !important;}
.subtitle{color:#dbe9f7 !important}
</style>
</head>
<body>
<a class="back-home" href="./index.html">&#8249; 云朵实验室</a>

<div class="cloud cloud-1"></div>
<div class="cloud cloud-2"></div>
<div class="cloud cloud-3"></div>
<div class="cloud cloud-4"></div>
<div class="cloud cloud-5"></div>
<div class="cloud cloud-6"></div>

<div class="page-title">
  <h1>☁️ 云端二维码</h1>
  <p>轻巧生成，随心定制</p>
</div>

<div class="main-container">

  <div class="card">
    <div class="card-label">快捷模板</div>
    <div class="template-bar">
      <button class="template-btn active" data-tpl="url">🔗 URL</button>
      <button class="template-btn" data-tpl="wifi">📶 WiFi</button>
      <button class="template-btn" data-tpl="email">📧 Email</button>
      <button class="template-btn" data-tpl="phone">📞 Phone</button>
      <button class="template-btn" data-tpl="sms">💬 SMS</button>
    </div>
  </div>

  <div class="card">
    <div class="card-label">内容输入</div>
    <div class="input-section">
      <div id="defaultInput">
        <textarea class="text-input" id="qrText" placeholder="输入文本或 URL..." rows="2"></textarea>
      </div>
      <div class="wifi-fields" id="wifiFields">
        <input class="text-input" id="wifiSSID" placeholder="网络名称 (SSID)">
        <input class="text-input" id="wifiPass" placeholder="密码" type="password">
        <div class="wifi-enc-row">
          <span>加密方式</span>
          <button class="enc-btn active" data-enc="WPA">WPA/WPA2</button>
          <button class="enc-btn" data-enc="WEP">WEP</button>
          <button class="enc-btn" data-enc="nopass">无密码</button>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-label">二维码预览</div>
    <div class="qr-display">
      <div class="qr-canvas-wrap">
        <div id="qrcode">
          <div class="qr-placeholder">输入内容后自动生成二维码 ✨</div>
        </div>
      </div>
      <div class="action-bar">
        <button class="action-btn btn-primary" id="downloadBtn">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          下载 PNG
        </button>
        <button class="action-btn btn-secondary" id="copyBtn">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
          复制到剪贴板
        </button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-label">自定义样式</div>
    <div class="customize-grid">
      <div class="customize-item">
        <label>前景色</label>
        <div class="color-pick-row">
          <input type="color" id="fgColor" value="#2f4e8d">
          <span class="color-hex" id="fgHex">#2f4e8d</span>
        </div>
      </div>
      <div class="customize-item">
        <label>背景色</label>
        <div class="color-pick-row">
          <input type="color" id="bgColor" value="#ffffff">
          <span class="color-hex" id="bgHex">#ffffff</span>
        </div>
      </div>
      <div class="customize-item">
        <label>尺寸</label>
        <select class="size-select" id="sizeSelect">
          <option value="128">128 × 128</option>
          <option value="192">192 × 192</option>
          <option value="256" selected>256 × 256</option>
          <option value="384">384 × 384</option>
          <option value="512">512 × 512</option>
        </select>
      </div>
      <div class="customize-item">
        <label>纠错等级</label>
        <div class="ec-row">
          <button class="ec-btn" data-ec="L">L · 7%</button>
          <button class="ec-btn active" data-ec="M">M · 15%</button>
          <button class="ec-btn" data-ec="Q">Q · 25%</button>
          <button class="ec-btn" data-ec="H">H · 30%</button>
        </div>
      </div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  var qrInstance = null;
  var currentTemplate = 'url';
  var currentEC = 'M';
  var currentEnc = 'WPA';
  var debounceTimer = null;

  var qrEl = document.getElementById('qrcode');
  var textInput = document.getElementById('qrText');
  var wifiFields = document.getElementById('wifiFields');
  var defaultInput = document.getElementById('defaultInput');
  var wifiSSID = document.getElementById('wifiSSID');
  var wifiPass = document.getElementById('wifiPass');
  var fgColorInput = document.getElementById('fgColor');
  var bgColorInput = document.getElementById('bgColor');
  var fgHex = document.getElementById('fgHex');
  var bgHex = document.getElementById('bgHex');
  var sizeSelect = document.getElementById('sizeSelect');
  var downloadBtn = document.getElementById('downloadBtn');
  var copyBtn = document.getElementById('copyBtn');
  var toastEl = document.getElementById('toast');

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(function(){ toastEl.classList.remove('show'); }, 2200);
  }

  function getQRText(){
    if(currentTemplate === 'wifi'){
      var ssid = wifiSSID.value.trim();
      var pass = wifiPass.value.trim();
      if(!ssid) return '';
      return 'WIFI:T:' + currentEnc + ';S:' + ssid + ';P:' + pass + ';;';
    }
    return textInput.value.trim();
  }

  function getECLevel(){
    var map = {L:QRCode.CorrectLevel.L,M:QRCode.CorrectLevel.M,Q:QRCode.CorrectLevel.Q,H:QRCode.CorrectLevel.H};
    return map[currentEC] || QRCode.CorrectLevel.M;
  }

  function generateQR(){
    var text = getQRText();
    var size = parseInt(sizeSelect.value);
    var fg = fgColorInput.value;
    var bg = bgColorInput.value;

    qrEl.innerHTML = '';

    if(!text){
      qrEl.innerHTML = '<div class="qr-placeholder">输入内容后自动生成二维码 ✨</div>';
      return;
    }

    try{
      qrInstance = new QRCode(qrEl, {
        text: text,
        width: size,
        height: size,
        colorDark: fg,
        colorLight: bg,
        correctLevel: getECLevel()
      });
    }catch(e){
      qrEl.innerHTML = '<div class="qr-placeholder">内容过长或无法编码 😢</div>';
    }
  }

  function debouncedGenerate(){
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(generateQR, 250);
  }

  function switchTemplate(tpl){
    currentTemplate = tpl;
    document.querySelectorAll('.template-btn').forEach(function(b){
      b.classList.toggle('active', b.dataset.tpl === tpl);
    });

    if(tpl === 'wifi'){
      wifiFields.classList.add('show');
      defaultInput.style.display = 'none';
    }else{
      wifiFields.classList.remove('show');
      defaultInput.style.display = '';
      var placeholders = {
        url:'输入 URL，如 https://example.com',
        email:'输入邮箱地址，如 hello@example.com',
        phone:'输入电话号码，如 +8613800138000',
        sms:'输入号码和内容，如 +8613800138000?body=Hello'
      };
      var prefixes = {email:'mailto:',phone:'tel:',sms:'sms:'};
      textInput.placeholder = placeholders[tpl] || '输入文本或 URL...';
    }
    debouncedGenerate();
  }

  function getPrefixedText(){
    var raw = textInput.value.trim();
    if(!raw) return '';
    if(currentTemplate === 'email' && !raw.startsWith('mailto:')) return 'mailto:' + raw;
    if(currentTemplate === 'phone' && !raw.startsWith('tel:')) return 'tel:' + raw;
    if(currentTemplate === 'sms' && !raw.startsWith('sms:')) return 'sms:' + raw;
    return raw;
  }

  function getFinalText(){
    if(currentTemplate === 'wifi') return getQRText();
    return getPrefixedText();
  }

  function generateQRFinal(){
    var text = getFinalText();
    var size = parseInt(sizeSelect.value);
    var fg = fgColorInput.value;
    var bg = bgColorInput.value;

    qrEl.innerHTML = '';
    if(!text){
      qrEl.innerHTML = '<div class="qr-placeholder">输入内容后自动生成二维码 ✨</div>';
      return;
    }
    try{
      qrInstance = new QRCode(qrEl, {
        text: text,
        width: size,
        height: size,
        colorDark: fg,
        colorLight: bg,
        correctLevel: getECLevel()
      });
    }catch(e){
      qrEl.innerHTML = '<div class="qr-placeholder">内容过长或无法编码 😢</div>';
    }
  }

  function debouncedGenerateFinal(){
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(generateQRFinal, 250);
  }

  document.querySelectorAll('.template-btn').forEach(function(btn){
    btn.addEventListener('click', function(){ switchTemplate(btn.dataset.tpl); });
  });

  textInput.addEventListener('input', debouncedGenerateFinal);
  wifiSSID.addEventListener('input', debouncedGenerateFinal);
  wifiPass.addEventListener('input', debouncedGenerateFinal);

  document.querySelectorAll('.enc-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      currentEnc = btn.dataset.enc;
      document.querySelectorAll('.enc-btn').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      if(currentEnc === 'nopass'){
        wifiPass.style.display = 'none';
      }else{
        wifiPass.style.display = '';
      }
      debouncedGenerateFinal();
    });
  });

  fgColorInput.addEventListener('input', function(){
    fgHex.textContent = fgColorInput.value;
    debouncedGenerateFinal();
  });
  bgColorInput.addEventListener('input', function(){
    bgHex.textContent = bgColorInput.value;
    debouncedGenerateFinal();
  });
  sizeSelect.addEventListener('change', debouncedGenerateFinal);

  document.querySelectorAll('.ec-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      currentEC = btn.dataset.ec;
      document.querySelectorAll('.ec-btn').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      debouncedGenerateFinal();
    });
  });

  function getQRCanvas(){
    var img = qrEl.querySelector('img');
    if(!img) return null;
    var canvas = document.createElement('canvas');
    canvas.width = img.naturalWidth || img.width;
    canvas.height = img.naturalHeight || img.height;
    var ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0);
    return canvas;
  }

  downloadBtn.addEventListener('click', function(){
    var canvas = getQRCanvas();
    if(!canvas){ showToast('请先生成二维码'); return; }
    var link = document.createElement('a');
    link.download = 'qrcode.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
    showToast('二维码已下载 🎉');
  });

  copyBtn.addEventListener('click', function(){
    var canvas = getQRCanvas();
    if(!canvas){ showToast('请先生成二维码'); return; }
    canvas.toBlob(function(blob){
      if(!blob){ showToast('复制失败'); return; }
      try{
        var item = new ClipboardItem({'image/png': blob});
        navigator.clipboard.write([item]).then(function(){
          showToast('已复制到剪贴板 📋');
        }).catch(function(){
          showToast('复制失败，请尝试下载');
        });
      }catch(e){
        showToast('浏览器不支持复制图片');
      }
    }, 'image/png');
  });

  switchTemplate('url');
})();
</script>
